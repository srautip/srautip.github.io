  <script>
    (function () {
      var raw = document.getElementById('stundentafel-data').textContent;
      var data = JSON.parse(raw);

      document.getElementById('schul-name').textContent = 'Stundentafel: ' + data.schul_name;
      document.getElementById('meta').textContent =
        data.tage.join(', ') + ' | ' + data.periods_per_day + ' Stunden/Tag | Stop-Grund: ' + data.stop_reason;

      // Parallelklassen (gleiche Klassenstufe, unterschiedliche Zeilen-
      // Position rowIndex) bekommen denselben Farbton (hue), aber
      // abgestufte Helligkeit (-10 Prozentpunkte je weiterer
      // Parallelklasse) - so bleiben sie auf einen Blick unterscheidbar,
      // ohne die Klassenstufen-Zuordnung (hue) zu verlieren.
      function stufeColor(stufeIndex, rowIndex) {
        var hue = Math.round((360 * stufeIndex) / Math.max(data.klassenstufen.length, 1));
        var lightness = 87 - rowIndex * 10;
        if (lightness < 40) lightness = 40;
        return 'hsl(' + hue + ', 65%, ' + lightness + '%)';
      }

      var lastTable = null;
      var lastLehrerTable = null;
      // Nur horizontal an die verfuegbare Breite anpassen - eine
      // zusaetzliche Verkleinerung anhand der Bildschirmhoehe wuerde bei
      // vielen Perioden/Spalten den Text unnoetig klein machen. Die Hoehe
      // folgt proportional (gleicher Skalierungsfaktor fuer beide Achsen,
      // kein Verzerren) - reicht die Bildschirmhoehe nicht, scrollt die
      // Seite normal statt die Schrift weiter zu schrumpfen. Wird sowohl
      // fuer den Klassen- als auch den Lehrerstundenplan verwendet.
      function fitOneTable(table, container) {
        if (!table) return;
        table.style.transform = 'none';
        var natW = table.scrollWidth;
        var natH = table.scrollHeight;
        var availW = container.clientWidth;
        var scale = availW / natW;
        if (!isFinite(scale) || scale <= 0) scale = 1;
        table.style.transform = 'scale(' + scale + ')';
        container.style.height = (natH * scale) + 'px';
      }
      function fitTable() {
        fitOneTable(lastTable, document.getElementById('table-container'));
        fitOneTable(lastLehrerTable, document.getElementById('lehrer-table-container'));
      }
      window.addEventListener('resize', fitTable);

      var select = document.getElementById('solution-select');
      data.solutions.forEach(function (sol, i) {
        var opt = document.createElement('option');
        opt.value = i;
        opt.textContent = 'Loesung ' + (i + 1) + ': ' + sol.status +
          ', ' + sol.kann_violation_count + ' Kann-Verstoesse, Quality ' + sol.quality_total.toFixed(1);
        select.appendChild(opt);
      });
      select.addEventListener('change', function () {
        render(parseInt(select.value, 10));
      });

      var stufeVisible = data.klassenstufen.map(function () { return true; });
      var filterBtn = document.getElementById('stufe-filter-btn');
      var filterMenu = document.getElementById('stufe-filter-menu');

      function updateFilterBtnLabel() {
        var count = stufeVisible.filter(Boolean).length;
        filterBtn.textContent = 'Klassenstufen (' + count + '/' + stufeVisible.length + ') ▾';
      }

      data.klassenstufen.forEach(function (ks, ksIndex) {
        var label = document.createElement('label');
        var checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = true;
        checkbox.addEventListener('change', function () {
          stufeVisible[ksIndex] = checkbox.checked;
          updateFilterBtnLabel();
          syncLehrerFilterToStufen();
          render(parseInt(select.value, 10));
        });
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(ks.bezeichnung));
        filterMenu.appendChild(label);
      });
      updateFilterBtnLabel();

      filterBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        filterMenu.hidden = !filterMenu.hidden;
      });
      document.addEventListener('click', function (e) {
        if (!filterMenu.hidden && e.target !== filterBtn && !filterMenu.contains(e.target)) {
          filterMenu.hidden = true;
        }
      });

      // Lehrerliste UND Klasse->Lehrer-Zuordnung werden aus ALLEN Loesungen
      // zusammengefuehrt (nicht nur der aktuell gewaehlten) -
      // teacher_subject_assignment ist bereits vor SolveTop fest
      // zugeordnet, die Lehrkraefte-Menge ist deshalb ueber alle Loesungen
      // identisch; die Union macht das robust auch ohne diese Annahme zu
      // erzwingen. Zellen mit mehreren gleichzeitig unterrichtenden
      // Lehrkraeften (Parallelgruppen, z.B. "Ethiklehrer-1 / Religions-
      // lehrer-ev-1 / ...") werden auf ihre einzelnen Namen aufgeteilt,
      // damit jede Lehrkraft im Filter einzeln waehlbar ist UND korrekt
      // ihrer jeweiligen Klasse zugeordnet wird (classTeachers).
      var teacherSet = {};
      var classTeachers = {};
      data.solutions.forEach(function (sol) {
        Object.keys(sol.classes).forEach(function (klasse) {
          var perClass = sol.classes[klasse];
          if (!classTeachers[klasse]) classTeachers[klasse] = {};
          data.tage.forEach(function (tag) {
            for (var p = 1; p <= data.periods_per_day; p++) {
              var cell = perClass[tag] ? perClass[tag][String(p)] : null;
              if (cell && cell.teacher) {
                cell.teacher.split(' / ').forEach(function (t) {
                  teacherSet[t] = true;
                  classTeachers[klasse][t] = true;
                });
              }
            }
          });
        });
      });
      var allTeachers = Object.keys(teacherSet).sort();

      var lehrerVisible = {};
      var lehrerCheckboxes = {};
      allTeachers.forEach(function (t) { lehrerVisible[t] = true; });
      var lehrerFilterBtn = document.getElementById('lehrer-filter-btn');
      var lehrerFilterMenu = document.getElementById('lehrer-filter-menu');

      function updateLehrerFilterBtnLabel() {
        var count = allTeachers.filter(function (t) { return lehrerVisible[t]; }).length;
        lehrerFilterBtn.textContent = 'Lehrkraefte (' + count + '/' + allTeachers.length + ') ▾';
      }

      // Wird vom Klassenstufen-Filter aufgerufen (siehe Checkbox-Handler
      // oben): setzt die Lehrer-Auswahl komplett neu auf genau die
      // Lehrkraefte, die in einer der aktuell sichtbaren Klassenstufen
      // unterrichten - ueberschreibt eine vorherige manuelle
      // Lehrer-Auswahl bewusst, wie angefragt ("Lehrer auf alle in den
      // gefilterten Klassenstufen enthaltenen Lehrer gefiltert").
      function syncLehrerFilterToStufen() {
        var relevant = {};
        visibleKlassenstufen().forEach(function (entry) {
          entry.ks.klassen.forEach(function (klasse) {
            if (klasse === null || !classTeachers[klasse]) return;
            Object.keys(classTeachers[klasse]).forEach(function (t) { relevant[t] = true; });
          });
        });
        allTeachers.forEach(function (t) {
          var visible = !!relevant[t];
          lehrerVisible[t] = visible;
          if (lehrerCheckboxes[t]) lehrerCheckboxes[t].checked = visible;
        });
        updateLehrerFilterBtnLabel();
      }

      allTeachers.forEach(function (t) {
        var label = document.createElement('label');
        var checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = true;
        checkbox.addEventListener('change', function () {
          lehrerVisible[t] = checkbox.checked;
          updateLehrerFilterBtnLabel();
          render(parseInt(select.value, 10));
        });
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(t));
        lehrerFilterMenu.appendChild(label);
        lehrerCheckboxes[t] = checkbox;
      });
      updateLehrerFilterBtnLabel();

      lehrerFilterBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        lehrerFilterMenu.hidden = !lehrerFilterMenu.hidden;
      });
      document.addEventListener('click', function (e) {
        if (!lehrerFilterMenu.hidden && e.target !== lehrerFilterBtn && !lehrerFilterMenu.contains(e.target)) {
          lehrerFilterMenu.hidden = true;
        }
      });

      function visibleKlassenstufen() {
        var result = [];
        data.klassenstufen.forEach(function (ks, ksIndex) {
          if (stufeVisible[ksIndex]) {
            result.push({ ks: ks, index: ksIndex });
          }
        });
        return result;
      }

      function buildSparkline(points) {
        var w = 260, h = 60, pad = 6;
        var maxT = points[points.length - 1].elapsed_s || 1;
        var objs = points.map(function (p) { return p.objective_value; });
        var minObj = Math.min.apply(null, objs);
        var maxObj = Math.max.apply(null, objs);
        var objRange = (maxObj - minObj) || 1;

        var coords = points.map(function (p) {
          var x = pad + (p.elapsed_s / maxT) * (w - 2 * pad);
          // Standard chart convention: the larger value plots higher on
          // screen (SVG y grows downward, so this needs the "1 - ..."
          // flip). Lower objective is better, so as the solve improves
          // over time the line falls toward the bottom - directly
          // mirroring the number itself dropping, same as any normal
          // "this value is decreasing" chart.
          var y = pad + (1 - (p.objective_value - minObj) / objRange) * (h - 2 * pad);
          return x.toFixed(1) + ',' + y.toFixed(1);
        });

        var svgNs = 'http://www.w3.org/2000/svg';
        var svg = document.createElementNS(svgNs, 'svg');
        svg.setAttribute('width', w);
        svg.setAttribute('height', h);
        svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);

        var polyline = document.createElementNS(svgNs, 'polyline');
        polyline.setAttribute('points', coords.join(' '));
        polyline.setAttribute('fill', 'none');
        polyline.setAttribute('stroke', '#333');
        polyline.setAttribute('stroke-width', '1.5');
        svg.appendChild(polyline);

        coords.forEach(function (c) {
          var parts = c.split(',');
          var circle = document.createElementNS(svgNs, 'circle');
          circle.setAttribute('cx', parts[0]);
          circle.setAttribute('cy', parts[1]);
          circle.setAttribute('r', '2');
          circle.setAttribute('fill', '#333');
          svg.appendChild(circle);
        });

        return svg;
      }

      function renderConvergence(sol) {
        var panel = document.getElementById('convergence-panel');
        panel.innerHTML = '';

        var gapLine = document.createElement('div');
        gapLine.className = 'gap-line';
        if (sol.status === 'Optimal') {
          gapLine.textContent = 'Optimalitaets-Luecke: bewiesen optimal (0%).';
        } else {
          gapLine.textContent = 'Optimalitaets-Luecke: bis zu ' + sol.gap_percent.toFixed(1) +
            '% moegliche Verbesserung (Objective ' + sol.objective_value.toFixed(1) +
            ', bewiesene untere Schranke ' + sol.best_objective_bound.toFixed(1) + ').';
        }
        panel.appendChild(gapLine);

        var note = document.createElement('div');
        note.className = 'conv-note';
        if (sol.convergence.length > 1) {
          var last = sol.convergence[sol.convergence.length - 1];
          note.textContent = 'Verlauf dieses Solve-Versuchs (letzte Verbesserung bei ' + last.elapsed_s.toFixed(1) + 's):';
          panel.appendChild(note);
          panel.appendChild(buildSparkline(sol.convergence));
        } else {
          note.textContent = 'Nur eine Loesung in diesem Versuch gefunden - kein Verbesserungsverlauf.';
          panel.appendChild(note);
        }
      }

      function cellContentHtml(klasse, cell) {
        var badge = '<span class="klasse-badge">' + klasse + '</span>';
        var teacher = cell.teacher ? '<div class="teacher">' + cell.teacher + '</div>' : '';
        var title = cell.room ? ' title="Raum: ' + cell.room + '"' : '';
        return '<span' + title + '>' + badge + '<div class="subject">' + cell.subject + '</div>' + teacher + '</span>';
      }

      // Der Lehrerstundenplan wird NICHT vom Solver/Formatting.vb geliefert
      // (nur klassenweise Grids sind eingebettet) - er wird hier rein
      // clientseitig aus denselben sol.classes-Daten abgeleitet, die auch
      // der Klassenstundenplan verwendet (also garantiert dieselbe
      // Loesung). Bei einer Parallelgruppen-Zelle (mehrere gleichzeitig
      // unterrichtende Lehrkraefte, subject/teacher als " / "-Liste in
      // MATCHENDER Reihenfolge, siehe Formatting.vb GridToJsonObject)
      // werden alle Klassen, die zur selben Zeit vom selben Lehrer
      // unterrichtet werden, zu einer Zelle zusammengefasst.
      function teacherSlotEntries(sol, teacherName, day, period) {
        var subjectToClasses = {};
        Object.keys(sol.classes).forEach(function (klasse) {
          var perClass = sol.classes[klasse];
          var cell = perClass && perClass[day] ? perClass[day][String(period)] : null;
          if (!cell || !cell.teacher) return;
          var subjects = cell.subject.split(' / ');
          var teachers = cell.teacher.split(' / ');
          teachers.forEach(function (t, idx) {
            if (t === teacherName) {
              var subj = subjects[idx] !== undefined ? subjects[idx] : cell.subject;
              if (!subjectToClasses[subj]) subjectToClasses[subj] = [];
              subjectToClasses[subj].push(klasse);
            }
          });
        });
        return Object.keys(subjectToClasses).map(function (s) {
          return { subject: s, classes: subjectToClasses[s] };
        });
      }

      function renderLehrerTable(sol) {
        var container = document.getElementById('lehrer-table-container');
        var visibleTeachers = allTeachers.filter(function (t) { return lehrerVisible[t]; });
        if (visibleTeachers.length === 0) {
          lastLehrerTable = null;
          container.style.height = '';
          container.innerHTML = '';
          var msg = document.createElement('div');
          msg.style.padding = '1rem';
          msg.textContent = 'Keine Lehrkraft ausgewaehlt.';
          container.appendChild(msg);
          return;
        }

        var table = document.createElement('table');
        var thead = document.createElement('thead');

        var headRow1 = document.createElement('tr');
        var stdTh = document.createElement('th');
        stdTh.textContent = 'Std.';
        stdTh.rowSpan = 2;
        headRow1.appendChild(stdTh);
        data.tage.forEach(function (tag) {
          var th = document.createElement('th');
          th.textContent = tag;
          th.colSpan = visibleTeachers.length;
          headRow1.appendChild(th);
        });
        thead.appendChild(headRow1);

        var headRow2 = document.createElement('tr');
        data.tage.forEach(function () {
          visibleTeachers.forEach(function (t) {
            var th = document.createElement('th');
            th.textContent = t;
            headRow2.appendChild(th);
          });
        });
        thead.appendChild(headRow2);
        table.appendChild(thead);

        var tbody = document.createElement('tbody');
        for (var period = 1; period <= data.periods_per_day; period++) {
          var tr = document.createElement('tr');
          var periodTh = document.createElement('th');
          periodTh.textContent = period;
          tr.appendChild(periodTh);
          data.tage.forEach(function (tag) {
            visibleTeachers.forEach(function (t) {
              var td = document.createElement('td');
              var entries = teacherSlotEntries(sol, t, tag, period);
              if (entries.length === 0) {
                td.className = 'leer';
              } else {
                td.innerHTML = entries.map(function (e) {
                  return '<div class="subject">' + e.subject + '</div><div class="teacher">' + e.classes.join(', ') + '</div>';
                }).join('');
              }
              tr.appendChild(td);
            });
          });
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);

        container.innerHTML = '';
        container.appendChild(table);
        lastLehrerTable = table;
      }

      function render(solIndex) {
        var sol = data.solutions[solIndex];
        document.getElementById('solution-summary').textContent =
          'Muss-Verstoesse: ' + sol.muss_violation_count + ' | Kann-Verstoesse: ' + sol.kann_violation_count +
          ' | Quality (Total): ' + sol.quality_total.toFixed(1);
        renderConvergence(sol);

        var container = document.getElementById('table-container');
        var vks = visibleKlassenstufen();
        if (vks.length === 0) {
          lastTable = null;
          container.style.height = '';
          container.innerHTML = '';
          var msg = document.createElement('div');
          msg.style.padding = '1rem';
          msg.textContent = 'Keine Klassenstufe ausgewaehlt.';
          container.appendChild(msg);
          renderLehrerTable(sol);
          fitTable();
          return;
        }

        var table = document.createElement('table');
        var thead = document.createElement('thead');

        var headRow1 = document.createElement('tr');
        var stdTh = document.createElement('th');
        stdTh.textContent = 'Std.';
        stdTh.rowSpan = 2;
        headRow1.appendChild(stdTh);
        data.tage.forEach(function (tag) {
          var th = document.createElement('th');
          th.textContent = tag;
          th.colSpan = vks.length;
          headRow1.appendChild(th);
        });
        thead.appendChild(headRow1);

        var headRow2 = document.createElement('tr');
        data.tage.forEach(function () {
          vks.forEach(function (entry) {
            var th = document.createElement('th');
            th.textContent = entry.ks.bezeichnung;
            th.style.backgroundColor = stufeColor(entry.index, 0);
            th.style.color = '#000';
            headRow2.appendChild(th);
          });
        });
        thead.appendChild(headRow2);
        table.appendChild(thead);

        var tbody = document.createElement('tbody');
        for (var period = 1; period <= data.periods_per_day; period++) {
          for (var rowIndex = 0; rowIndex < data.max_parallel_klassen; rowIndex++) {
            var tr = document.createElement('tr');
            if (rowIndex === 0) {
              var periodTh = document.createElement('th');
              periodTh.textContent = period;
              periodTh.rowSpan = data.max_parallel_klassen;
              tr.appendChild(periodTh);
            }
            data.tage.forEach(function (tag) {
              vks.forEach(function (entry) {
                var klasse = entry.ks.klassen[rowIndex];
                var td = document.createElement('td');
                var cell = null;
                if (klasse !== null) {
                  var perClass = sol.classes[klasse];
                  cell = perClass && perClass[tag] ? perClass[tag][String(period)] : null;
                }
                if (klasse === null || !cell) {
                  td.className = 'leer';
                } else {
                  td.style.backgroundColor = stufeColor(entry.index, rowIndex);
                  td.innerHTML = cellContentHtml(klasse, cell);
                }
                tr.appendChild(td);
              });
            });
            tbody.appendChild(tr);
          }
        }
        table.appendChild(tbody);

        container.innerHTML = '';
        container.appendChild(table);
        lastTable = table;
        renderLehrerTable(sol);
        fitTable();
      }

      if (data.solutions.length > 0) {
        select.value = 0;
        render(0);
      } else {
        document.getElementById('table-container').textContent = 'Keine Loesungen vorhanden.';
        document.getElementById('lehrer-table-container').textContent = 'Keine Loesungen vorhanden.';
      }
    })();
  </script>
</body>
</html>

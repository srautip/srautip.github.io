<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Stundentafel</title>
<style>
  :root {
    color-scheme: light;
  }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 1.5rem;
    background: #fff;
    color: #000;
  }
  h1 {
    font-size: 1.3rem;
    margin-bottom: 0.2rem;
    color: #000;
  }
  #meta {
    color: #333;
    margin-bottom: 1rem;
    font-size: 0.9rem;
  }
  #controls {
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  #solution-summary {
    font-size: 0.9rem;
    color: #000;
  }
  h2 {
    font-size: 1.05rem;
    margin: 1.2rem 0 0.4rem;
    color: #000;
  }
  #lehrer-controls {
    margin-bottom: 0.6rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  #table-container, #lehrer-table-container {
    overflow: hidden;
    border: 1px solid #ccc;
  }
  #table-container table, #lehrer-table-container table {
    transform-origin: top left;
  }
  table {
    border-collapse: collapse;
    font-size: 0.78rem;
    min-width: 100%;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 2px 4px;
    text-align: center;
    vertical-align: middle;
    min-width: 4.2rem;
    color: #000;
  }
  thead th {
    position: sticky;
    top: 0;
    background: #fff;
    color: #000;
    z-index: 2;
  }
  tbody th {
    position: sticky;
    left: 0;
    background: #fff;
    color: #000;
    z-index: 1;
  }
  td.leer {
    background: #e2e2e2;
  }
  .klasse-badge {
    display: block;
    font-weight: bold;
    font-size: 0.68rem;
    color: #000;
  }
  .subject {
    font-weight: 600;
    color: #000;
  }
  .teacher {
    font-size: 0.72rem;
    color: #000;
  }
  .dropdown {
    position: relative;
  }
  .dropdown-btn {
    font: inherit;
    padding: 0.3rem 0.6rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
    color: #000;
    cursor: pointer;
  }
  .dropdown-menu {
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 0.2rem;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 0.4rem 0.7rem;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    z-index: 10;
    min-width: 10rem;
  }
  .dropdown-menu[hidden] {
    display: none;
  }
  .dropdown-menu label {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.2rem 0;
    white-space: nowrap;
    cursor: pointer;
    color: #000;
  }
  /* Viewer-Ausbau Schritt 2 (docs/viewer-ausbau-plan.md): sortierbare
     Loesungsuebersicht - eine Zeile pro Loesung, Spalten = voller
     Qualitaetsvektor. Eigenstaendiger Scroll-Container; die globalen
     table/th/td-Regeln oben (min-width, sticky) werden hier gezielt
     zurueckgesetzt. */
  #solutions-overview {
    margin-bottom: 1rem;
    overflow-x: auto;
    border: 1px solid #ccc;
    max-height: 22rem;
    overflow-y: auto;
  }
  #solutions-overview table {
    font-variant-numeric: tabular-nums;
    font-size: 0.8rem;
    width: 100%;
  }
  #solutions-overview th, #solutions-overview td {
    min-width: 0;
    padding: 3px 8px;
    text-align: right;
    white-space: nowrap;
  }
  #solutions-overview th.txt, #solutions-overview td.txt {
    text-align: left;
  }
  #solutions-overview thead th {
    cursor: pointer;
    user-select: none;
  }
  #solutions-overview tbody tr {
    cursor: pointer;
  }
  #solutions-overview tbody tr:hover {
    background: #f2f2f2;
  }
  #solutions-overview tbody tr.active {
    background: #dcebff;
  }
  #solutions-overview .muted-col {
    color: #999;
  }
  #solutions-overview .overview-note {
    font-size: 0.75rem;
    color: #555;
    padding: 3px 8px;
  }
  /* Viewer-Ausbau Schritt 4: dominierte Loesungen werden abgedunkelt
     statt entfernt (Transparenz: sichtbar bleibt, WAS aussortiert
     wurde). */
  #solutions-overview tbody tr.dominated {
    opacity: 0.42;
  }
  /* Viewer-Ausbau Schritt 3: Gewichts-Panel - gleiche Dropdown-Optik wie
     die bestehenden Filter. */
  #weights-menu {
    min-width: 16rem;
  }
  #weights-menu .weight-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
    padding: 0.15rem 0;
  }
  #weights-menu .weight-row input {
    width: 5.5rem;
    font: inherit;
    text-align: right;
  }
  #weights-menu .weight-row.muted-crit span {
    color: #999;
  }
  #weights-menu .weights-note {
    font-size: 0.72rem;
    color: #555;
    max-width: 18rem;
    margin-top: 0.3rem;
  }
  #weights-menu .weights-reset {
    margin-top: 0.4rem;
    font: inherit;
    padding: 0.15rem 0.5rem;
    cursor: pointer;
  }
  #pareto-label {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.85rem;
    cursor: pointer;
  }
  #pareto-count {
    font-size: 0.8rem;
    color: #555;
  }
  /* Viewer-Ausbau Schritt 5: Loesungs-Diff - Zellen, die sich zwischen
     der gewaehlten und der Vergleichsloesung unterscheiden, bekommen
     einen deutlichen Rahmen (Inhalt bleibt der der gewaehlten Loesung;
     der Tooltip zeigt die Belegung der Vergleichsloesung). */
  td.diff-cell {
    outline: 3px solid #c2410c;
    outline-offset: -3px;
  }
  #compare-info {
    margin: 0 0 0.6rem;
    font-size: 0.85rem;
    color: #000;
  }
  #compare-info .compare-hint {
    color: #555;
    font-size: 0.78rem;
  }
  #solutions-overview tbody tr.compare {
    background: #fdf0e5;
  }
  #solutions-overview tbody tr.compare.active {
    background: #dcebff;
  }
  #convergence-panel {
    margin-bottom: 1rem;
    font-size: 0.85rem;
    color: #000;
  }
  #convergence-panel .gap-line {
    margin-bottom: 0.3rem;
  }
  #convergence-panel .conv-note {
    color: #333;
    font-size: 0.78rem;
    margin-bottom: 0.2rem;
  }
  #convergence-panel svg {
    display: block;
    background: #f7f7f7;
    border: 1px solid #ccc;
    border-radius: 3px;
  }
</style>
</head>

  <script>
    (function () {
      var raw = document.getElementById('stundentafel-data').textContent;
      var data = JSON.parse(raw);

      document.getElementById('schul-name').textContent = 'Stundentafel: ' + data.schul_name;
      document.getElementById('meta').textContent =
        data.tage.join(', ') + ' | ' + data.periods_per_day + ' Stunden/Tag | Stop-Grund: ' + data.stop_reason;

      // Parallelklassen (gleiche Klassenstufe, unterschiedliche Zeilen-
      // Position rowIndex) bekommen denselben Farbton (hue), aber
      // abgestufte Helligkeit (-10 Prozentpunkte je weiterer
      // Parallelklasse) - so bleiben sie auf einen Blick unterscheidbar,
      // ohne die Klassenstufen-Zuordnung (hue) zu verlieren.
      function stufeColor(stufeIndex, rowIndex) {
        var hue = Math.round((360 * stufeIndex) / Math.max(data.klassenstufen.length, 1));
        var lightness = 87 - rowIndex * 10;
        if (lightness < 40) lightness = 40;
        return 'hsl(' + hue + ', 65%, ' + lightness + '%)';
      }

      var lastTable = null;
      var lastLehrerTable = null;
      // Nur horizontal an die verfuegbare Breite anpassen - eine
      // zusaetzliche Verkleinerung anhand der Bildschirmhoehe wuerde bei
      // vielen Perioden/Spalten den Text unnoetig klein machen. Die Hoehe
      // folgt proportional (gleicher Skalierungsfaktor fuer beide Achsen,
      // kein Verzerren) - reicht die Bildschirmhoehe nicht, scrollt die
      // Seite normal statt die Schrift weiter zu schrumpfen. Wird sowohl
      // fuer den Klassen- als auch den Lehrerstundenplan verwendet.
      function fitOneTable(table, container) {
        if (!table) return;
        table.style.transform = 'none';
        var natW = table.scrollWidth;
        var natH = table.scrollHeight;
        var availW = container.clientWidth;
        var scale = availW / natW;
        if (!isFinite(scale) || scale <= 0) scale = 1;
        table.style.transform = 'scale(' + scale + ')';
        container.style.height = (natH * scale) + 'px';
      }
      function fitTable() {
        fitOneTable(lastTable, document.getElementById('table-container'));
        fitOneTable(lastLehrerTable, document.getElementById('lehrer-table-container'));
      }
      window.addEventListener('resize', fitTable);

      // Die Loesungsauswahl laeuft ausschliesslich ueber die
      // Uebersichtstabelle (Zeilenklick, siehe renderOverview) - das
      // fruehere "Loesung:"-Dropdown ist ersetzt. currentIndex ist die
      // eine Quelle der Wahrheit fuer die aktuell gewaehlte Loesung und
      // wird zentral in render() gesetzt.
      var currentIndex = 0;

      // ---- Loesungs-Diff (Viewer-Ausbau Schritt 5) ---------------------
      // Zweite Auswahl "Vergleichen mit": markiert im Klassen- UND
      // Lehrerraster jede Zelle, deren Belegung sich von der
      // Vergleichsloesung unterscheidet (Inhalt bleibt der der aktuell
      // gewaehlten Loesung, der Tooltip zeigt die Belegung der
      // Vergleichsloesung), und zeigt die Slot-Distanz an - dieselbe
      // Groessenordnung, die min_diversity beim Enumerieren erzwingt.
      var compareSelect = document.getElementById('compare-select');
      var compareIndex = null;
      (function () {
        var noneOpt = document.createElement('option');
        noneOpt.value = '';
        noneOpt.textContent = '- kein Vergleich -';
        compareSelect.appendChild(noneOpt);
        data.solutions.forEach(function (sol, i) {
          var opt = document.createElement('option');
          opt.value = i;
          opt.textContent = 'Loesung ' + (i + 1);
          compareSelect.appendChild(opt);
        });
        compareSelect.addEventListener('change', function () {
          compareIndex = compareSelect.value === '' ? null : parseInt(compareSelect.value, 10);
          render(currentIndex);
        });
      })();

      function getCell(sol, klasse, tag, periode) {
        var perClass = sol.classes[klasse];
        return perClass && perClass[tag] ? perClass[tag][String(periode)] : null;
      }
      function cellSignature(cell) {
        if (!cell) return '';
        return (cell.subject || '') + '|' + (cell.teacher || '') + '|' + (cell.room || '');
      }
      // Der Vergleich laeuft ueber die tatsaechliche Belegung
      // (Fach/Lehrkraft/Raum) je (Klasse, Tag, Stunde) - "frei" vs.
      // "belegt" zaehlt ebenso als Unterschied wie andere Inhalte.
      function cellsDiffer(solA, solB, klasse, tag, periode) {
        return cellSignature(getCell(solA, klasse, tag, periode)) !==
               cellSignature(getCell(solB, klasse, tag, periode));
      }
      function computeDiffCount(solA, solB) {
        var count = 0;
        var klassen = {};
        Object.keys(solA.classes).forEach(function (k) { klassen[k] = true; });
        Object.keys(solB.classes).forEach(function (k) { klassen[k] = true; });
        Object.keys(klassen).forEach(function (klasse) {
          data.tage.forEach(function (tag) {
            for (var p = 1; p <= data.periods_per_day; p++) {
              if (cellsDiffer(solA, solB, klasse, tag, p)) count++;
            }
          });
        });
        return count;
      }
      function compareTitle(cellB) {
        if (!cellB) return 'Vergleichsloesung: frei';
        var text = cellB.subject + (cellB.teacher ? ' (' + cellB.teacher + ')' : '');
        if (cellB.room) text += ' [' + cellB.room + ']';
        return 'Vergleichsloesung ' + (compareIndex + 1) + ': ' + text;
      }
      function activeCompareSol(solIndex) {
        if (compareIndex === null || compareIndex === solIndex) return null;
        return data.solutions[compareIndex];
      }
      function updateCompareInfo(solIndex) {
        var info = document.getElementById('compare-info');
        var cmp = activeCompareSol(solIndex);
        if (!cmp) {
          info.hidden = true;
          info.innerHTML = '';
          return;
        }
        var diffCount = computeDiffCount(data.solutions[solIndex], cmp);
        info.hidden = false;
        info.innerHTML = '';
        var line = document.createElement('div');
        line.textContent = 'Vergleich Loesung ' + (solIndex + 1) + ' mit Loesung ' + (compareIndex + 1) +
          ': ' + diffCount + ' unterschiedlich belegte Slots';
        info.appendChild(line);
        var hint = document.createElement('div');
        hint.className = 'compare-hint';
        hint.textContent = 'Markierte Zellen unterscheiden sich - der Tooltip zeigt die Belegung der Vergleichsloesung.';
        info.appendChild(hint);
      }
      // ------------------------------------------------------------------

      // ---- Loesungsuebersicht (Viewer-Ausbau Schritt 2) ----------------
      // Eine Zeile pro Loesung mit dem vollen Qualitaetsvektor; Klick auf
      // eine Zeile waehlt die Loesung, Klick auf einen Spaltenkopf
      // sortiert. Aeltere stundenplan.json ohne die neuen Felder bleiben
      // oeffenbar: fehlende Werte erscheinen als "-" und sortieren ans
      // Ende. Kriterien, die per include_*-Flag strukturell aus der SUCHE
      // ausgeschlossen waren, werden gedaempft dargestellt - ihr Wert ist
      // nur nachgelagert gezaehlt.
      var qw = data.quality_weights || {};
      function isMuted(includeKey) {
        return qw[includeKey] === false;
      }

      // ---- Gewichts-Regler + Pareto-Filter (Viewer-Ausbau 3+4) ---------
      // Beide brauchen den vollen Qualitaetsvektor pro Loesung; bei
      // aelteren stundenplan.json ohne die Felder bleiben Panel und
      // Filter ausgeblendet (defensiv, wie die '-'-Spalten).
      // subject_window_count kam nachtraeglich dazu (Rhythmisierung:
      // subject_period_window-Constraint). Fehlt das Feld, stammt die
      // JSON aus einer Zeit, in der der Constraint-Typ nicht existierte -
      // 0 ist dann der KORREKTE Wert (nicht "unbekannt"), deshalb wird
      // er normalisiert statt die Vektor-Features zu deaktivieren.
      data.solutions.forEach(function (s) {
        if (s.subject_window_count === undefined || s.subject_window_count === null) s.subject_window_count = 0;
      });
      var vectorFields = ['muss_violation_count', 'kann_violation_count', 'occupied_density_count',
        'subject_window_count', 'class_gap_count', 'teacher_gap_count', 'edge_period_count',
        'afternoon_day_count', 'class_load_variance', 'teacher_load_variance'];
      var hasFullVector = data.solutions.length > 0 && data.solutions.every(function (s) {
        return vectorFields.every(function (f) { return s[f] !== undefined && s[f] !== null; });
      });

      // Schritt 3: Total wird client-seitig aus Vektor x Gewichten neu
      // berechnet - bewusste, dokumentierte Duplikation der Formel aus
      // ScheduleQuality.Score, damit der Viewer eine per Doppelklick
      // oeffenbare statische Datei ohne Server bleibt. Die Regler aendern
      // NUR das Ranking/die Anzeige der bereits gefundenen Loesungen,
      // nie die Suche (die lief mit den Schulgewichten bzw. Stufen).
      var weightDefs = [
        { key: 'kann', label: 'Kann-Verstoss', field: 'kann_violation_count' },
        { key: 'class_gaps', label: 'Springstd. Klassen', field: 'class_gap_count', includeKey: 'include_class_gaps' },
        { key: 'teacher_gaps', label: 'Springstd. Lehrer', field: 'teacher_gap_count', includeKey: 'include_teacher_gaps' },
        { key: 'occupied_density', label: 'Fenster-Slot frei', field: 'occupied_density_count', includeKey: 'include_occupied_density' },
        { key: 'subject_window', label: 'Fach-Fenster-Verstoss', field: 'subject_window_count', includeKey: 'include_subject_window' },
        { key: 'edge_period', label: 'Randstunde', field: 'edge_period_count', includeKey: 'include_edge_period' },
        { key: 'afternoon_day_count', label: 'Nachmittags-Tag', field: 'afternoon_day_count', includeKey: 'include_afternoon_day_count' },
        { key: 'class_load_variance', label: 'Var. Klassen', field: 'class_load_variance', includeKey: 'include_class_load_variance' },
        { key: 'teacher_load_variance', label: 'Var. Lehrer', field: 'teacher_load_variance', includeKey: 'include_teacher_load_variance' }
      ];
      var weightsEnabled = hasFullVector && !!data.quality_weights;
      var schoolWeights = {};
      var currentWeights = {};
      weightDefs.forEach(function (d) {
        schoolWeights[d.key] = (typeof qw[d.key] === 'number') ? qw[d.key] : 0;
        currentWeights[d.key] = schoolWeights[d.key];
      });
      function computeTotal(sol, weights) {
        var total = 0;
        weightDefs.forEach(function (d) { total += weights[d.key] * sol[d.field]; });
        return total;
      }
      function displayTotal(sol) {
        return weightsEnabled ? computeTotal(sol, currentWeights) : sol.quality_total;
      }
      function weightsDirty() {
        return weightDefs.some(function (d) { return currentWeights[d.key] !== schoolWeights[d.key]; });
      }

      // Schritt 4: Dominanz ueber den ECHTEN Vektor (inkl. Muss und der
      // strukturell abgeschalteten Kriterien), gewichtsunabhaengig - der
      // Filter ergaenzt die Regler, statt sie zu doppeln. Loesung b
      // dominiert a, wenn b in ALLEN Feldern <= a und in mindestens
      // einem < a ist. Einmal berechnet (statische Daten).
      var dominatedBy = {};
      if (hasFullVector) {
        data.solutions.forEach(function (a, i) {
          for (var j = 0; j < data.solutions.length; j++) {
            if (i === j) continue;
            var b = data.solutions[j];
            var allLe = true;
            var oneLt = false;
            for (var f = 0; f < vectorFields.length; f++) {
              var fa = a[vectorFields[f]];
              var fb = b[vectorFields[f]];
              if (fb > fa) { allLe = false; break; }
              if (fb < fa) oneLt = true;
            }
            if (allLe && oneLt) {
              dominatedBy[i] = j + 1;
              break;
            }
          }
        });
      }
      var paretoActive = false;
      // ------------------------------------------------------------------
      var overviewColumns = [
        { key: '__nr', label: 'Nr.', txt: true },
        { key: 'status', label: 'Status', txt: true },
        { key: 'muss_violation_count', label: 'Muss' },
        { key: 'kann_violation_count', label: 'Kann' },
        { key: 'occupied_density_count', label: 'Fenster frei', muted: isMuted('include_occupied_density') },
        { key: 'subject_window_count', label: 'Fach-Fenster', muted: isMuted('include_subject_window') },
        { key: 'class_gap_count', label: 'Springstd. Kl.', muted: isMuted('include_class_gaps') },
        { key: 'teacher_gap_count', label: 'Springstd. Lehrer', muted: isMuted('include_teacher_gaps') },
        { key: 'edge_period_count', label: 'Randstd.', muted: isMuted('include_edge_period') },
        { key: 'afternoon_day_count', label: 'Nachm.-Tage', muted: isMuted('include_afternoon_day_count') },
        { key: 'class_load_variance', label: 'Var. Klassen', digits: 2, muted: isMuted('include_class_load_variance') },
        { key: 'teacher_load_variance', label: 'Var. Lehrer', digits: 2, muted: isMuted('include_teacher_load_variance') },
        { key: 'quality_total', label: 'Total', digits: 1 }
      ];
      var mutedTitle = 'Suche war fuer dieses Kriterium blind (include-Flag aus) - Wert nur nachgelagert gezaehlt';
      var overviewSort = { key: 'quality_total', dir: 1 };

      function overviewValue(sol, col) {
        if (col.key === '__nr') return sol.__nr;
        if (col.key === 'quality_total') return displayTotal(sol);
        return sol[col.key];
      }
      function formatOverviewValue(v, col) {
        if (v === undefined || v === null) return '-';
        if (col.digits !== undefined && typeof v === 'number') return v.toFixed(col.digits);
        return String(v);
      }

      function renderOverview() {
        var container = document.getElementById('solutions-overview');
        container.innerHTML = '';
        if (data.solutions.length === 0) return;

        var rows = data.solutions.map(function (sol, i) {
          sol.__nr = i + 1;
          return sol;
        }).slice();
        var sortCol = null;
        overviewColumns.forEach(function (c) { if (c.key === overviewSort.key) sortCol = c; });
        if (sortCol) {
          rows.sort(function (a, b) {
            var va = overviewValue(a, sortCol);
            var vb = overviewValue(b, sortCol);
            if (va === undefined || va === null) return 1;
            if (vb === undefined || vb === null) return -1;
            if (va < vb) return -overviewSort.dir;
            if (va > vb) return overviewSort.dir;
            return a.__nr - b.__nr;
          });
        }

        var table = document.createElement('table');
        var thead = document.createElement('thead');
        var headRow = document.createElement('tr');
        overviewColumns.forEach(function (col) {
          var th = document.createElement('th');
          var arrow = '';
          if (overviewSort.key === col.key) arrow = overviewSort.dir === 1 ? ' ▲' : ' ▼';
          var label = col.label;
          if (col.key === 'quality_total' && weightsEnabled && weightsDirty()) {
            label = col.label + '*';
            th.title = 'Total mit den aktuell eingestellten (vom Schul-Default abweichenden) Gewichten berechnet';
          }
          th.textContent = label + arrow;
          if (col.txt) th.className = 'txt';
          if (col.muted) {
            th.className = (th.className ? th.className + ' ' : '') + 'muted-col';
            th.title = mutedTitle;
          }
          th.addEventListener('click', function () {
            if (overviewSort.key === col.key) {
              overviewSort.dir = -overviewSort.dir;
            } else {
              overviewSort.key = col.key;
              overviewSort.dir = 1;
            }
            renderOverview();
          });
          headRow.appendChild(th);
        });
        thead.appendChild(headRow);
        table.appendChild(thead);

        var tbody = document.createElement('tbody');
        rows.forEach(function (sol) {
          var tr = document.createElement('tr');
          tr.setAttribute('data-sol-index', sol.__nr - 1);
          if (paretoActive && dominatedBy[sol.__nr - 1] !== undefined) {
            tr.setAttribute('data-dominated', '1');
            tr.title = 'Dominiert von Loesung ' + dominatedBy[sol.__nr - 1] + ' (in allen Kriterien mindestens gleich gut, in mindestens einem besser)';
          }
          overviewColumns.forEach(function (col) {
            var td = document.createElement('td');
            td.textContent = formatOverviewValue(overviewValue(sol, col), col);
            if (col.txt) td.className = 'txt';
            if (col.muted) {
              td.className = (td.className ? td.className + ' ' : '') + 'muted-col';
              td.title = mutedTitle;
            }
            tr.appendChild(td);
          });
          tr.addEventListener('click', function () {
            render(sol.__nr - 1);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        container.appendChild(table);

        var note = document.createElement('div');
        note.className = 'overview-note';
        note.textContent = 'Zeile anklicken = Loesung waehlen; Spaltenkopf anklicken = sortieren. Gedaempfte Spalten waren fuer die Suche strukturell abgeschaltet.';
        container.appendChild(note);
        updateOverviewActive(currentIndex);
      }

      function updateOverviewActive(solIndex) {
        var trs = document.getElementById('solutions-overview').querySelectorAll('tbody tr');
        for (var i = 0; i < trs.length; i++) {
          var idx = parseInt(trs[i].getAttribute('data-sol-index'), 10);
          var classes = [];
          if (trs[i].getAttribute('data-dominated') === '1') classes.push('dominated');
          if (idx === solIndex) classes.push('active');
          if (compareIndex !== null && compareIndex !== solIndex && idx === compareIndex) classes.push('compare');
          trs[i].className = classes.join(' ');
        }
      }

      // Gewichts-Panel (Schritt 3) aufbauen - nur bei vollem Vektor +
      // exportierten Gewichten sichtbar.
      var weightsBtn = document.getElementById('weights-btn');
      var weightsMenu = document.getElementById('weights-menu');
      if (weightsEnabled) {
        weightsBtn.hidden = false;
        var weightInputs = {};
        weightDefs.forEach(function (d) {
          var row = document.createElement('div');
          row.className = 'weight-row' + (d.includeKey && isMuted(d.includeKey) ? ' muted-crit' : '');
          var span = document.createElement('span');
          span.textContent = d.label;
          if (d.includeKey && isMuted(d.includeKey)) span.title = mutedTitle;
          var input = document.createElement('input');
          input.type = 'number';
          input.min = '0';
          input.step = 'any';
          input.value = currentWeights[d.key];
          input.addEventListener('input', function () {
            var v = parseFloat(input.value);
            currentWeights[d.key] = isFinite(v) && v >= 0 ? v : 0;
            renderOverview();
            updateSummary(currentIndex);
          });
          weightInputs[d.key] = input;
          row.appendChild(span);
          row.appendChild(input);
          weightsMenu.appendChild(row);
        });
        var weightsNote = document.createElement('div');
        weightsNote.className = 'weights-note';
        weightsNote.textContent = 'Gewichte wirken nur auf Total/Ranking der bereits gefundenen Loesungen - nicht auf die Suche (die lief mit den Schulgewichten bzw. den lexikografischen Stufen).';
        weightsMenu.appendChild(weightsNote);
        var resetBtn = document.createElement('button');
        resetBtn.type = 'button';
        resetBtn.className = 'weights-reset';
        resetBtn.textContent = 'Schulgewichte zuruecksetzen';
        resetBtn.addEventListener('click', function () {
          weightDefs.forEach(function (d) {
            currentWeights[d.key] = schoolWeights[d.key];
            weightInputs[d.key].value = schoolWeights[d.key];
          });
          renderOverview();
          updateSummary(currentIndex);
        });
        weightsMenu.appendChild(resetBtn);

        weightsBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          weightsMenu.hidden = !weightsMenu.hidden;
        });
        document.addEventListener('click', function (e) {
          if (!weightsMenu.hidden && e.target !== weightsBtn && !weightsMenu.contains(e.target)) {
            weightsMenu.hidden = true;
          }
        });
      }

      // Pareto-Toggle (Schritt 4) - nur bei vollem Vektor sichtbar.
      var paretoToggle = document.getElementById('pareto-toggle');
      var paretoCount = document.getElementById('pareto-count');
      if (hasFullVector) {
        document.getElementById('pareto-label').hidden = false;
        paretoToggle.addEventListener('change', function () {
          paretoActive = paretoToggle.checked;
          if (paretoActive) {
            var dominatedCount = Object.keys(dominatedBy).length;
            paretoCount.textContent = (data.solutions.length - dominatedCount) + ' von ' + data.solutions.length + ' Loesungen Pareto-optimal';
            paretoCount.hidden = false;
          } else {
            paretoCount.hidden = true;
          }
          renderOverview();
        });
      }
      // ------------------------------------------------------------------

      var stufeVisible = data.klassenstufen.map(function () { return true; });
      var filterBtn = document.getElementById('stufe-filter-btn');
      var filterMenu = document.getElementById('stufe-filter-menu');

      function updateFilterBtnLabel() {
        var count = stufeVisible.filter(Boolean).length;
        filterBtn.textContent = 'Klassenstufen (' + count + '/' + stufeVisible.length + ') ▾';
      }

      data.klassenstufen.forEach(function (ks, ksIndex) {
        var label = document.createElement('label');
        var checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = true;
        checkbox.addEventListener('change', function () {
          stufeVisible[ksIndex] = checkbox.checked;
          updateFilterBtnLabel();
          syncLehrerFilterToStufen();
          render(currentIndex);
        });
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(ks.bezeichnung));
        filterMenu.appendChild(label);
      });
      updateFilterBtnLabel();

      filterBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        filterMenu.hidden = !filterMenu.hidden;
      });
      document.addEventListener('click', function (e) {
        if (!filterMenu.hidden && e.target !== filterBtn && !filterMenu.contains(e.target)) {
          filterMenu.hidden = true;
        }
      });

      // Lehrerliste UND Klasse->Lehrer-Zuordnung werden aus ALLEN Loesungen
      // zusammengefuehrt (nicht nur der aktuell gewaehlten) -
      // teacher_subject_assignment ist bereits vor SolveTop fest
      // zugeordnet, die Lehrkraefte-Menge ist deshalb ueber alle Loesungen
      // identisch; die Union macht das robust auch ohne diese Annahme zu
      // erzwingen. Zellen mit mehreren gleichzeitig unterrichtenden
      // Lehrkraeften (Parallelgruppen, z.B. "Ethiklehrer-1 / Religions-
      // lehrer-ev-1 / ...") werden auf ihre einzelnen Namen aufgeteilt,
      // damit jede Lehrkraft im Filter einzeln waehlbar ist UND korrekt
      // ihrer jeweiligen Klasse zugeordnet wird (classTeachers).
      var teacherSet = {};
      var classTeachers = {};
      data.solutions.forEach(function (sol) {
        Object.keys(sol.classes).forEach(function (klasse) {
          var perClass = sol.classes[klasse];
          if (!classTeachers[klasse]) classTeachers[klasse] = {};
          data.tage.forEach(function (tag) {
            for (var p = 1; p <= data.periods_per_day; p++) {
              var cell = perClass[tag] ? perClass[tag][String(p)] : null;
              if (cell && cell.teacher) {
                cell.teacher.split(' / ').forEach(function (t) {
                  teacherSet[t] = true;
                  classTeachers[klasse][t] = true;
                });
              }
            }
          });
        });
      });
      var allTeachers = Object.keys(teacherSet).sort();

      var lehrerVisible = {};
      var lehrerCheckboxes = {};
      allTeachers.forEach(function (t) { lehrerVisible[t] = true; });
      var lehrerFilterBtn = document.getElementById('lehrer-filter-btn');
      var lehrerFilterMenu = document.getElementById('lehrer-filter-menu');

      function updateLehrerFilterBtnLabel() {
        var count = allTeachers.filter(function (t) { return lehrerVisible[t]; }).length;
        lehrerFilterBtn.textContent = 'Lehrkraefte (' + count + '/' + allTeachers.length + ') ▾';
      }

      // Wird vom Klassenstufen-Filter aufgerufen (siehe Checkbox-Handler
      // oben): setzt die Lehrer-Auswahl komplett neu auf genau die
      // Lehrkraefte, die in einer der aktuell sichtbaren Klassenstufen
      // unterrichten - ueberschreibt eine vorherige manuelle
      // Lehrer-Auswahl bewusst, wie angefragt ("Lehrer auf alle in den
      // gefilterten Klassenstufen enthaltenen Lehrer gefiltert").
      function syncLehrerFilterToStufen() {
        var relevant = {};
        visibleKlassenstufen().forEach(function (entry) {
          entry.ks.klassen.forEach(function (klasse) {
            if (klasse === null || !classTeachers[klasse]) return;
            Object.keys(classTeachers[klasse]).forEach(function (t) { relevant[t] = true; });
          });
        });
        allTeachers.forEach(function (t) {
          var visible = !!relevant[t];
          lehrerVisible[t] = visible;
          if (lehrerCheckboxes[t]) lehrerCheckboxes[t].checked = visible;
        });
        updateLehrerFilterBtnLabel();
      }

      allTeachers.forEach(function (t) {
        var label = document.createElement('label');
        var checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = true;
        checkbox.addEventListener('change', function () {
          lehrerVisible[t] = checkbox.checked;
          updateLehrerFilterBtnLabel();
          render(currentIndex);
        });
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(t));
        lehrerFilterMenu.appendChild(label);
        lehrerCheckboxes[t] = checkbox;
      });
      updateLehrerFilterBtnLabel();

      lehrerFilterBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        lehrerFilterMenu.hidden = !lehrerFilterMenu.hidden;
      });
      document.addEventListener('click', function (e) {
        if (!lehrerFilterMenu.hidden && e.target !== lehrerFilterBtn && !lehrerFilterMenu.contains(e.target)) {
          lehrerFilterMenu.hidden = true;
        }
      });

      function visibleKlassenstufen() {
        var result = [];
        data.klassenstufen.forEach(function (ks, ksIndex) {
          if (stufeVisible[ksIndex]) {
            result.push({ ks: ks, index: ksIndex });
          }
        });
        return result;
      }

      function buildSparkline(points) {
        var w = 260, h = 60, pad = 6;
        var maxT = points[points.length - 1].elapsed_s || 1;
        var objs = points.map(function (p) { return p.objective_value; });
        var minObj = Math.min.apply(null, objs);
        var maxObj = Math.max.apply(null, objs);
        var objRange = (maxObj - minObj) || 1;

        var coords = points.map(function (p) {
          var x = pad + (p.elapsed_s / maxT) * (w - 2 * pad);
          // Standard chart convention: the larger value plots higher on
          // screen (SVG y grows downward, so this needs the "1 - ..."
          // flip). Lower objective is better, so as the solve improves
          // over time the line falls toward the bottom - directly
          // mirroring the number itself dropping, same as any normal
          // "this value is decreasing" chart.
          var y = pad + (1 - (p.objective_value - minObj) / objRange) * (h - 2 * pad);
          return x.toFixed(1) + ',' + y.toFixed(1);
        });

        var svgNs = 'http://www.w3.org/2000/svg';
        var svg = document.createElementNS(svgNs, 'svg');
        svg.setAttribute('width', w);
        svg.setAttribute('height', h);
        svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);

        var polyline = document.createElementNS(svgNs, 'polyline');
        polyline.setAttribute('points', coords.join(' '));
        polyline.setAttribute('fill', 'none');
        polyline.setAttribute('stroke', '#333');
        polyline.setAttribute('stroke-width', '1.5');
        svg.appendChild(polyline);

        coords.forEach(function (c) {
          var parts = c.split(',');
          var circle = document.createElementNS(svgNs, 'circle');
          circle.setAttribute('cx', parts[0]);
          circle.setAttribute('cy', parts[1]);
          circle.setAttribute('r', '2');
          circle.setAttribute('fill', '#333');
          svg.appendChild(circle);
        });

        return svg;
      }

      function renderConvergence(sol) {
        var panel = document.getElementById('convergence-panel');
        panel.innerHTML = '';

        var gapLine = document.createElement('div');
        gapLine.className = 'gap-line';
        if (sol.status === 'Optimal') {
          gapLine.textContent = 'Optimalitaets-Luecke: bewiesen optimal (0%).';
        } else {
          gapLine.textContent = 'Optimalitaets-Luecke: bis zu ' + sol.gap_percent.toFixed(1) +
            '% moegliche Verbesserung (Objective ' + sol.objective_value.toFixed(1) +
            ', bewiesene untere Schranke ' + sol.best_objective_bound.toFixed(1) + ').';
        }
        panel.appendChild(gapLine);

        var note = document.createElement('div');
        note.className = 'conv-note';
        if (sol.convergence.length > 1) {
          var last = sol.convergence[sol.convergence.length - 1];
          note.textContent = 'Verlauf dieses Solve-Versuchs (letzte Verbesserung bei ' + last.elapsed_s.toFixed(1) + 's):';
          panel.appendChild(note);
          panel.appendChild(buildSparkline(sol.convergence));
        } else {
          note.textContent = 'Nur eine Loesung in diesem Versuch gefunden - kein Verbesserungsverlauf.';
          panel.appendChild(note);
        }
      }

      function cellContentHtml(klasse, cell) {
        var badge = '<span class="klasse-badge">' + klasse + '</span>';
        var teacher = cell.teacher ? '<div class="teacher">' + cell.teacher + '</div>' : '';
        var title = cell.room ? ' title="Raum: ' + cell.room + '"' : '';
        return '<span' + title + '>' + badge + '<div class="subject">' + cell.subject + '</div>' + teacher + '</span>';
      }

      // Der Lehrerstundenplan wird NICHT vom Solver/Formatting.vb geliefert
      // (nur klassenweise Grids sind eingebettet) - er wird hier rein
      // clientseitig aus denselben sol.classes-Daten abgeleitet, die auch
      // der Klassenstundenplan verwendet (also garantiert dieselbe
      // Loesung). Bei einer Parallelgruppen-Zelle (mehrere gleichzeitig
      // unterrichtende Lehrkraefte, subject/teacher als " / "-Liste in
      // MATCHENDER Reihenfolge, siehe Formatting.vb GridToJsonObject)
      // werden alle Klassen, die zur selben Zeit vom selben Lehrer
      // unterrichtet werden, zu einer Zelle zusammengefasst.
      function teacherSlotEntries(sol, teacherName, day, period) {
        var subjectToClasses = {};
        Object.keys(sol.classes).forEach(function (klasse) {
          var perClass = sol.classes[klasse];
          var cell = perClass && perClass[day] ? perClass[day][String(period)] : null;
          if (!cell || !cell.teacher) return;
          var subjects = cell.subject.split(' / ');
          var teachers = cell.teacher.split(' / ');
          teachers.forEach(function (t, idx) {
            if (t === teacherName) {
              var subj = subjects[idx] !== undefined ? subjects[idx] : cell.subject;
              if (!subjectToClasses[subj]) subjectToClasses[subj] = [];
              subjectToClasses[subj].push(klasse);
            }
          });
        });
        return Object.keys(subjectToClasses).map(function (s) {
          return { subject: s, classes: subjectToClasses[s] };
        });
      }

      // Schritt 5: Signatur der Lehrer-Zelle (alle Eintraege sortiert
      // zusammengefasst) fuer den Diff-Vergleich im Lehrerraster.
      function teacherEntriesSignature(sol, teacherName, tag, period) {
        return teacherSlotEntries(sol, teacherName, tag, period).
          map(function (e) { return e.subject + '|' + e.classes.join(','); }).
          sort().join(';');
      }
      function teacherEntriesText(sol, teacherName, tag, period) {
        var entries = teacherSlotEntries(sol, teacherName, tag, period);
        if (entries.length === 0) return 'frei';
        return entries.map(function (e) { return e.subject + ' (' + e.classes.join(', ') + ')'; }).join('; ');
      }

      function renderLehrerTable(sol, cmpSol) {
        var container = document.getElementById('lehrer-table-container');
        var visibleTeachers = allTeachers.filter(function (t) { return lehrerVisible[t]; });
        if (visibleTeachers.length === 0) {
          lastLehrerTable = null;
          container.style.height = '';
          container.innerHTML = '';
          var msg = document.createElement('div');
          msg.style.padding = '1rem';
          msg.textContent = 'Keine Lehrkraft ausgewaehlt.';
          container.appendChild(msg);
          return;
        }

        var table = document.createElement('table');
        var thead = document.createElement('thead');

        var headRow1 = document.createElement('tr');
        var stdTh = document.createElement('th');
        stdTh.textContent = 'Std.';
        stdTh.rowSpan = 2;
        headRow1.appendChild(stdTh);
        data.tage.forEach(function (tag) {
          var th = document.createElement('th');
          th.textContent = tag;
          th.colSpan = visibleTeachers.length;
          headRow1.appendChild(th);
        });
        thead.appendChild(headRow1);

        var headRow2 = document.createElement('tr');
        data.tage.forEach(function () {
          visibleTeachers.forEach(function (t) {
            var th = document.createElement('th');
            th.textContent = t;
            headRow2.appendChild(th);
          });
        });
        thead.appendChild(headRow2);
        table.appendChild(thead);

        var tbody = document.createElement('tbody');
        for (var period = 1; period <= data.periods_per_day; period++) {
          var tr = document.createElement('tr');
          var periodTh = document.createElement('th');
          periodTh.textContent = period;
          tr.appendChild(periodTh);
          data.tage.forEach(function (tag) {
            visibleTeachers.forEach(function (t) {
              var td = document.createElement('td');
              var entries = teacherSlotEntries(sol, t, tag, period);
              if (entries.length === 0) {
                td.className = 'leer';
              } else {
                td.innerHTML = entries.map(function (e) {
                  return '<div class="subject">' + e.subject + '</div><div class="teacher">' + e.classes.join(', ') + '</div>';
                }).join('');
              }
              if (cmpSol && teacherEntriesSignature(sol, t, tag, period) !== teacherEntriesSignature(cmpSol, t, tag, period)) {
                td.className += (td.className ? ' ' : '') + 'diff-cell';
                td.title = 'Vergleichsloesung ' + (compareIndex + 1) + ': ' + teacherEntriesText(cmpSol, t, tag, period);
              }
              tr.appendChild(td);
            });
          });
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);

        container.innerHTML = '';
        container.appendChild(table);
        lastLehrerTable = table;
      }

      function updateSummary(solIndex) {
        var sol = data.solutions[solIndex];
        if (!sol) return;
        var totalLabel = (weightsEnabled && weightsDirty()) ? 'Quality (Total*)' : 'Quality (Total)';
        // Ohne das fruehere Dropdown traegt die Zusammenfassung die
        // Kennung der gewaehlten Loesung selbst.
        document.getElementById('solution-summary').textContent =
          'Loesung ' + (solIndex + 1) + ' (' + sol.status + ')' +
          ' | Muss-Verstoesse: ' + sol.muss_violation_count + ' | Kann-Verstoesse: ' + sol.kann_violation_count +
          ' | ' + totalLabel + ': ' + displayTotal(sol).toFixed(1);
      }

      function render(solIndex) {
        currentIndex = solIndex;
        var sol = data.solutions[solIndex];
        var cmpSol = activeCompareSol(solIndex);
        updateSummary(solIndex);
        updateOverviewActive(solIndex);
        updateCompareInfo(solIndex);
        renderConvergence(sol);

        var container = document.getElementById('table-container');
        var vks = visibleKlassenstufen();
        if (vks.length === 0) {
          lastTable = null;
          container.style.height = '';
          container.innerHTML = '';
          var msg = document.createElement('div');
          msg.style.padding = '1rem';
          msg.textContent = 'Keine Klassenstufe ausgewaehlt.';
          container.appendChild(msg);
          renderLehrerTable(sol, cmpSol);
          fitTable();
          return;
        }

        var table = document.createElement('table');
        var thead = document.createElement('thead');

        var headRow1 = document.createElement('tr');
        var stdTh = document.createElement('th');
        stdTh.textContent = 'Std.';
        stdTh.rowSpan = 2;
        headRow1.appendChild(stdTh);
        data.tage.forEach(function (tag) {
          var th = document.createElement('th');
          th.textContent = tag;
          th.colSpan = vks.length;
          headRow1.appendChild(th);
        });
        thead.appendChild(headRow1);

        var headRow2 = document.createElement('tr');
        data.tage.forEach(function () {
          vks.forEach(function (entry) {
            var th = document.createElement('th');
            th.textContent = entry.ks.bezeichnung;
            th.style.backgroundColor = stufeColor(entry.index, 0);
            th.style.color = '#000';
            headRow2.appendChild(th);
          });
        });
        thead.appendChild(headRow2);
        table.appendChild(thead);

        var tbody = document.createElement('tbody');
        for (var period = 1; period <= data.periods_per_day; period++) {
          for (var rowIndex = 0; rowIndex < data.max_parallel_klassen; rowIndex++) {
            var tr = document.createElement('tr');
            if (rowIndex === 0) {
              var periodTh = document.createElement('th');
              periodTh.textContent = period;
              periodTh.rowSpan = data.max_parallel_klassen;
              tr.appendChild(periodTh);
            }
            data.tage.forEach(function (tag) {
              vks.forEach(function (entry) {
                var klasse = entry.ks.klassen[rowIndex];
                var td = document.createElement('td');
                var cell = null;
                if (klasse !== null) {
                  var perClass = sol.classes[klasse];
                  cell = perClass && perClass[tag] ? perClass[tag][String(period)] : null;
                }
                if (klasse === null || !cell) {
                  td.className = 'leer';
                } else {
                  td.style.backgroundColor = stufeColor(entry.index, rowIndex);
                  td.innerHTML = cellContentHtml(klasse, cell);
                }
                if (klasse !== null && cmpSol && cellsDiffer(sol, cmpSol, klasse, tag, period)) {
                  td.className += (td.className ? ' ' : '') + 'diff-cell';
                  td.title = compareTitle(getCell(cmpSol, klasse, tag, period));
                }
                tr.appendChild(td);
              });
            });
            tbody.appendChild(tr);
          }
        }
        table.appendChild(tbody);

        container.innerHTML = '';
        container.appendChild(table);
        lastTable = table;
        renderLehrerTable(sol, cmpSol);
        fitTable();
      }

      if (data.solutions.length > 0) {
        renderOverview();
        render(0);
      } else {
        document.getElementById('table-container').textContent = 'Keine Loesungen vorhanden.';
        document.getElementById('lehrer-table-container').textContent = 'Keine Loesungen vorhanden.';
      }
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Klassenbildung</title>
<style>
/* == DESIGN-TOKENS: erzeugt aus Templates/design-tokens.css.
      NICHT VON HAND AENDERN - DesignTokenTests haelt die Kopien
      zeichengleich zur Quelle. == */
:root {
  color-scheme: light;

  /* --- Neutrale, als ROLLEN statt als Rampe. Leichter Kaltstich in
         Richtung des Akzents: reines Grau neben blauem Akzent liest
         sich schmutzig. Acht Rollen ersetzen die rund zwanzig
         Einzelwerte des Bestands - #ccc, #bbb, #ddd, #999 und #eee
         heissen dort alle "ein Rahmen".
         Die zugrundeliegende Zehnerrampe ist bewusst NICHT als Token
         abgelegt: sie ist die Herleitung, nicht die Schnittstelle.
         Als Token waere sie eine zweite Wahrheit neben den Rollen
         (jeder Wert stuende zweimal da) und haette tote Stufen. --- */
  --farbe-flaeche:#ffffff;
  --farbe-flaeche-2:#fafbfc;
  --farbe-flaeche-3:#f2f4f7;
  --farbe-linie:#e6e9ee;
  --farbe-linie-stark:#d5dae1;
  --farbe-text:#1a1f26;
  --farbe-text-2:#626b76;
  --farbe-text-3:#8a929d;

  /* --- Status: gesaettigt, kleinflaechig, IMMER mit Symbol.
         Ein Triplett je Zustand macht die heutigen zwei Gelbtoene
         (#a16207 fuer den Text, #ca8a04 fuer Balken und Kartenkante)
         und die zwei Neutralgraus (#94a3b8/#9ca3af) strukturell
         unmoeglich. Die Symbole bleiben Text - die Doppelkodierung
         ist laut klassenbildung-konzept.md:419 Pflicht. --- */
  --farbe-ok-text:#0f7938;    --farbe-ok-rand:#86c9a4;    --farbe-ok-flaeche:#e9f6ef;
  --farbe-warn-text:#6f7400;  --farbe-warn-rand:#d6d45c;  --farbe-warn-flaeche:#f9f9e0;
  /* Gelb als FLAECHE (Punkt, Balken, Kante): ein echtes, leicht
     gruenliches Gelb - "knapp" ist kein Alarm, und das fruehere Braun
     las sich wie einer. Als Text waere es unlesbar; deshalb eine eigene
     Rolle neben dem olivfarbenen Text. */
  --farbe-warn-marke:#d9cf00;
  --farbe-krit-text:#b3261e;  --farbe-krit-rand:#eaa6a1;  --farbe-krit-flaeche:#fcecea;
  /* "frei" hat bewusst KEINE eigene Flaeche: sie waere wertgleich mit
     --farbe-flaeche-3 und damit eine zweite Wahrheit fuer denselben Ton. */
  --farbe-frei-text:#626b76;  --farbe-frei-rand:#d5dae1;

  --farbe-akzent:#0f6cbd;
  --farbe-akzent-hover:#115ea3;
  --farbe-akzent-flaeche:#eff6fc;
  --farbe-diff:#a8480b;
  /* Vergleichsauswahl ist NICHT dasselbe wie aktive Auswahl - beide
     koennen gleichzeitig sichtbar sein (eine Loesung gewaehlt, eine
     zum Vergleich). Deshalb eine eigene Rolle statt eines Farbtons
     der Akzentfamilie. */
  --farbe-vergleich-flaeche:#fdf1e3;

  /* --- Kategoriale Palette: 16 Gruppenfarben.
         Basis hsl(H 38% 46%) in gleichmaessigen 22,5-Grad-Schritten,
         danach 10 % eines Ockers hsl(35 38% 46%) beigemischt. Der
         Anker hat DIESELBE Saettigung und Helligkeit - die Mischung
         verschiebt deshalb nur den Ton und daempft die kalten Toene,
         ohne die Helligkeit anzutasten.

         Die feste, niedrige Saettigung ist die tragende Zusage:
         eine GESAETTIGTE Farbe im Bild ist immer Status, nie
         Identitaet (klassenbildung-ui-konzept.md:35 nennt die
         Trennung "strikt" und fordert entsaettigte Toene). Eine
         reine Ton-Trennung waere bei 16 Kategorien unmoeglich - die
         drei Ampelbaender belegen ein Sechstel des Kreises; die
         Trennung MUSS auf Saettigung plus Pflicht-Kuerzel ruhen.

         Reihenfolge handsortiert: benachbarte Indizes liegen
         mindestens 45 Grad auseinander, denn genau die treffen im
         Board aufeinander. Rot steht bewusst auf Platz 16.

         Heute verletzt der Bestand die eigene Regel: #15803d ist
         gleichzeitig Ampel-Gruen und Gruppenfarbe 11, #c2410c
         gleichzeitig Diff-Marker und Gruppenfarbe 16. --- */
  --kat-1:#528099;  --kat-2:#529e7b;  --kat-3:#984e99;  --kat-4:#a28b49;
  --kat-5:#529e99;  --kat-6:#a24e85;  --kat-7:#7a9e49;  --kat-8:#5c4e99;
  --kat-9:#a26c49;  --kat-10:#529e5d; --kat-11:#7a4e99; --kat-12:#989e49;
  --kat-13:#526299; --kat-14:#a24e67; --kat-15:#5c9e49; --kat-16:#a24e49;

  /* --- Typografie: fuenf Rollen statt vierzehn gewachsener Werte.
         Keine Webschrift - die Viewer laufen per Doppelklick ohne
         Netz, ein CDN scheidet aus (viewer-ausbau-plan.md
         "Leitplanken"). Hierarchie kommt aus Groesse, Gewicht und
         Flaeche. Zeilenhoehen sind heute NIRGENDS deklariert. --- */
  --schrift-stapel:-apple-system,"Segoe UI",Roboto,sans-serif;
  --schrift-mono:ui-monospace,Consolas,monospace;
  --t-titel:1.25rem;
  --t-kopf:0.9375rem;
  --t-basis:0.8125rem;
  --t-klein:0.75rem;
  --t-mikro:0.6875rem;
  --lh-eng:1.2;
  --lh-basis:1.4;

  /* --- Mass: 4-px-Raster. Heute liegen die Werte auf jedem
         0,05-rem-Schritt zwischen 0,1 und 0,6 - kein Raster. --- */
  --mass-05:2px; --mass-1:4px; --mass-2:8px; --mass-3:12px;
  --mass-4:16px; --mass-5:20px; --mass-6:24px;

  /* --- Radius nach Rolle: Marke, Steuerelement, Flaeche. --- */
  --radius-s:2px; --radius-m:4px; --radius-l:8px;

  /* --- Elevation: EIN Rezept fuer schwebende Flaechen. Popover und
         Aufklappmenue teilen sich heute die Rolle, aber nicht das
         Rezept - zwei Raender, zwei Radien, zwei Schatten. --- */
  --schatten-1:0 2px 8px rgba(16,24,40,.10), 0 0 1px rgba(16,24,40,.16);

  /* --- Zustand. Der Fokusring ist neu: es gibt heute keine einzige
         :focus-Regel, obwohl klassenbildung-ui-konzept.md:203
         Tastaturbedienung ausdruecklich zusagt. --- */
  --zustand-hover:rgba(16,24,40,.045);
  --fokus-ring:2px solid var(--farbe-akzent);
  --uebergang:120ms ease;

  /* --- Dichte. --dichte-zeile meint die GESAMTHOEHE der Zeile, nicht
         ihre Inhaltshoehe - die Zeilenelemente setzen dafuer
         box-sizing:border-box. Ohne das kaemen Polsterung und Rahmen
         obendrauf, und "22 px" ergaeben 28 (live gemessen).
         Stufe "kompakt" entspricht der heutigen Kartenhoehe von 24 px. Kompakt kostet also nichts; komfortabel ist der
         Zugewinn fuer kleinere Anzeigen. --- */
  --dichte-zeile:24px;
  --dichte-pad-y:2px;
  --dichte-pad-x:6px;
  --dichte-gap:4px;
}

:root[data-dichte="komfortabel"] {
  --dichte-zeile:32px;
  --dichte-pad-y:5px;
  --dichte-pad-x:9px;
  --dichte-gap:6px;
}

/* Bewegung abschalten, wenn das System es verlangt. Bewusst ueber den
   Token und nicht ueber `* { transition: none !important }`: jeder
   Uebergang liest --uebergang, also genuegt EINE Zuweisung - kein
   Spezifitaetskampf, kein !important. Das ist der Nutzen des
   Token-Satzes an einer Stelle, an der man ihn sofort sieht. */
@media (prefers-reduced-motion: reduce) {
  :root { --uebergang:0s; }
}
/* == ENDE DESIGN-TOKENS == */

/* == DESIGN-BASIS: erzeugt aus Templates/design-basis.css.
      NICHT VON HAND AENDERN - DesignTokenTests haelt die Kopien
      zeichengleich zur Quelle. == */
  body {
    font-family: var(--schrift-stapel);
    margin: var(--mass-6);
    background: var(--farbe-flaeche);
    color: var(--farbe-text);
    font-size: var(--t-basis);
    line-height: var(--lh-basis);
  }
  h1 {
    font-size: var(--t-titel);
    line-height: var(--lh-eng);
    margin-bottom: var(--mass-1);
    color: var(--farbe-text);
  }
  h2 {
    font-size: var(--t-kopf);
    line-height: var(--lh-eng);
    margin: var(--mass-5) 0 var(--mass-2);
    color: var(--farbe-text);
  }
  #meta {
    color: var(--farbe-text-2);
    margin-bottom: var(--mass-4);
    font-size: var(--t-basis);
  }
  #controls {
    margin-bottom: var(--mass-4);
    display: flex;
    align-items: center;
    gap: var(--mass-3);
    flex-wrap: wrap;
    font-size: var(--t-klein);
  }
  #compare-info {
    margin: 0 0 var(--mass-2);
    font-size: var(--t-klein);
    color: var(--farbe-text-2);
  }

  /* Sichtbarer Fokus fuer Tastaturbedienung. `:focus-visible` statt
     `:focus`, damit Mausnutzer keinen Ring sehen. Es gab bisher in
     KEINER Vorlage eine Fokusregel, obwohl
     klassenbildung-ui-konzept.md:203 Tastaturbedienung ausdruecklich
     zusagt ("Pin = Enter auf fokussierter Karte").

     `[tabindex]` deckt alles ab, was in Stufe 5 fokussierbar gemacht
     wird - Karten, Badges, Panelzeilen, Loesungszeilen. Deshalb steht
     hier eine Regel und nicht eine Liste, die dann mitwachsen muesste.
     Selektoren, die in einer Vorlage nichts treffen, sind harmlos. */
  a:focus-visible,
  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible,
  select:focus-visible,
  [tabindex]:focus-visible {
    outline: var(--fokus-ring);
    outline-offset: 1px;
  }

  /* Symbole aus dem Inline-Sprite (siehe direkt nach <body>).
     Monochrom, erben currentColor, skalieren mit der Schriftgroesse -
     und vor allem: keine Datei, keine Schrift, kein CDN. Damit passen
     sie unter die Self-contained-Leitplanke, die den Doppelklick-
     Betrieb sichert (viewer-ausbau-plan.md "Leitplanken").

     Vorher standen dort Emoji. Die rendern in FARBE und je nach
     Betriebssystem verschieden, ignorieren die Textfarbe, sind in der
     Groesse nicht steuerbar und drucken schlecht - auf einer Flaeche,
     deren gesamte Bedeutungslehre auf kontrollierter Farbe beruht, ist
     ein unkontrolliert farbiges Zeichen ein Fremdkoerper.

     KEIN uebernommenes Duplikat, sondern eine neue geteilte Regel des
     Designsystems: die Stundentafel nutzt den Satz heute noch nicht,
     eine Klasse ohne Verwendung ist dort aber folgenlos. */
  .ico {
    width: 1em;
    height: 1em;
    flex: none;
    vertical-align: -0.125em;
  }
  .ico use, .ico path, .ico rect, .ico circle {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .ico.voll path, .ico.voll rect { fill: currentColor; }
  .ico-punkte circle { fill: currentColor; stroke: none; }

  /* ---- Druck ----------------------------------------------------
     Es gab bisher kein Druckbild, obwohl Stundenplan und Klassenliste
     die typischen Druckartefakte sind - und obwohl das Konzept den
     Druck ausdruecklich als Grund fuer die Gruppen-Kuerzel nennt
     (klassenbildung-ui-konzept.md:41).

     Selektoren, die in einer der beiden Vorlagen nichts treffen, sind
     folgenlos; deshalb steht der Block geteilt statt zweimal. */
  @media print {
    /* OHNE das hier faerbt kein Browser die Flaechen - und damit
       verschwaende genau die Kodierung, um die es geht: Ampelrand,
       Gruppenfarbe, belegte Zelle. */
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    body { margin: 0; background: #fff; }

    /* Bedienelemente drucken nicht mit - sie sind auf Papier weder
       bedienbar noch informativ. */
    #controls, #prozess, #varianten, #warnung, #fixierungen,
    #pareto-label, #compare-info, .dropdown, #weights-menu,
    button, .karte .pin, .gruppe-zeile .fixieren { display: none; }

    /* Zusammengehoeriges nicht ueber die Seitengrenze reissen. */
    .karte, .stapel, .klasse-spalte, .gruppe-zeile, tr { break-inside: avoid; }
    h1, h2 { break-after: avoid; }

    /* Auf Papier gibt es keinen Scrollbereich - alles muss stehen. */
    #panel, #table-container, #lehrer-table-container, #solutions-overview {
      max-height: none;
      overflow: visible;
    }
    /* Schwebende Flaechen und Hover-Zustaende sind auf Papier sinnlos. */
    #popover { display: none; }
    .karte, .klasse-spalte, #panel, .variante-kachel { box-shadow: none; }

    /* Kopfzeilen wiederholen sich auf jeder Seite - ein Raster ohne
       Tages- und Stundenspalte ist auf Seite zwei nicht mehr lesbar. */
    thead { display: table-header-group; }
  }
/* == ENDE DESIGN-BASIS == */

  button {
    font: inherit;
    font-size: var(--t-klein);
    padding: var(--mass-1) var(--mass-3);
    border: 1px solid var(--farbe-linie-stark);
    border-radius: var(--radius-m);
    background: var(--farbe-flaeche);
    color: var(--farbe-text);
    cursor: pointer;
    transition: background var(--uebergang), border-color var(--uebergang);
  }
  button:hover { background: var(--zustand-hover); }
  button.primaer {
    border-color: var(--farbe-akzent);
    background: var(--farbe-akzent);
    color: var(--farbe-flaeche);
  }
  button.primaer:hover {
    border-color: var(--farbe-akzent-hover);
    background: var(--farbe-akzent-hover);
  }

  /* ---- Kopfbereich (U6/D): Fortschritt, Varianten, Filter als EIN
     Kasten. Vorher drei getrennte Kaesten mit eigenem Rand und Abstand
     (~200 px); die Fortschrittsleiste war eine Textzeile "[1] ... [5]"
     ohne Balken. Jetzt: Balken mit Anteilen (fixiert / offen mit
     Diskussionsbedarf / offen ruhig), daneben die zwei Bulk-Knoepfe. */
  #prozess {
    display: flex;
    align-items: center;
    gap: var(--mass-3);
    flex-wrap: wrap;
    border: 1px solid var(--farbe-linie);
    border-radius: var(--radius-l) var(--radius-l) 0 0;
    padding: var(--mass-1) var(--mass-3);
    min-height: var(--dichte-zeile);
    box-sizing: border-box;
    font-size: var(--t-klein);
    background: var(--farbe-flaeche-2);
  }
  #prozess .schritt {
    color: var(--farbe-text-2);
    white-space: nowrap;
  }
  #prozess .schritt b { color: var(--farbe-text); }
  #prozess .fortschritt {
    flex: 0 0 10rem;
    display: flex;
    height: 10px;
    border-radius: var(--radius-s);
    overflow: hidden;
    background: var(--farbe-linie-stark);
  }
  #prozess .fortschritt i { display: block; height: 100%; }
  #prozess .fortschritt i.fixiert { background: var(--farbe-akzent); }
  #prozess .zaehler {
    font-weight: 600;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  #prozess .knoepfe { margin-left: auto; display: flex; gap: var(--mass-2); align-items: center; flex-wrap: wrap; }
  #prozess .knoepfe .trenner { width: 1px; height: 1.4em; background: var(--farbe-linie-stark); margin: 0 var(--mass-1); }
  #prozess button { padding: var(--mass-05) var(--mass-2); min-height: 0; }

  /* ---- Scorecard-Leiste (U6): eine Zeile je Variante ----
     Vorher drei fast gleiche Textkacheln, deren einzige Unterschiede
     (Diff, Ampel) in der dritten Zeile als Fliesstext standen, und ein
     getrenntes Vergleichs-Dropdown fuer dieselben Varianten. Jetzt eine
     Tabelle: Basis (Radio) und Vergleich (Haken) sind Spalten derselben
     Zeile, die Ampel ist ein Balken, und die Verstoesse je Prio - die
     der Export schon immer trug - werden erstmals sichtbar. */
  #varianten {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--farbe-linie);
    border-top: none;
    margin-bottom: 0;
    font-size: var(--t-klein);
    overflow: hidden;
    background: var(--farbe-flaeche);
  }
  /* Die Filterzeile ist der Fuss des Kastens. Spezifischere Regel statt
     einer zweiten `#controls`-Deklaration - die Basis bleibt die eine
     Quelle (DesignTokenTests.DieBasisStehtVorDenEigenenRegeln). */
  #controls.kopf-fuss {
    border: 1px solid var(--farbe-linie);
    border-top: none;
    border-radius: 0 0 var(--radius-l) var(--radius-l);
    padding: var(--mass-1) var(--mass-3);
    background: var(--farbe-flaeche-2);
    margin-bottom: var(--mass-3);
  }
  .variante-kachel, .arbeits-zeile, #varianten .kopfzeile {
    display: grid;
    grid-template-columns: 2.6rem 2.2rem 8rem 4.5rem 4.5rem minmax(12rem, 1fr) 16rem;
    align-items: center;
    gap: var(--mass-2);
    padding: var(--mass-05) var(--mass-3);
    min-height: var(--dichte-zeile);
    box-sizing: border-box;
  }
  #varianten .kopfzeile {
    font-size: var(--t-mikro);
    color: var(--farbe-text-3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    background: var(--farbe-flaeche-2);
    border-bottom: 1px solid var(--farbe-linie);
    min-height: 0;
  }
  .variante-kachel {
    cursor: pointer;
    transition: background var(--uebergang);
  }
  .variante-kachel + .variante-kachel, .arbeits-zeile { border-top: 1px solid var(--farbe-linie); }
  .variante-kachel:hover { background: var(--zustand-hover); }
  .variante-kachel.active { background: var(--farbe-akzent-flaeche); }
  /* Auswahl und Vergleich gleich stark, jede in ihrer eigenen Rolle. */
  .variante-kachel.compare { background: var(--farbe-vergleich-flaeche); }
  .variante-kachel .kopf { font-weight: 600; }
  .variante-kachel .zeile, .arbeits-zeile .zeile { color: var(--farbe-text-2); font-variant-numeric: tabular-nums; }
  .variante-kachel input, .arbeits-zeile input { margin: 0; cursor: pointer; }
  .arbeits-zeile .kopf { font-weight: 600; color: var(--farbe-akzent); }
  .ampel-zelle { display: flex; align-items: center; gap: var(--mass-2); min-width: 0; }
  .ampel-balken {
    flex: 1 1 auto;
    display: flex;
    height: 10px;
    border-radius: var(--radius-s);
    overflow: hidden;
    background: var(--farbe-flaeche-3);
  }
  .ampel-balken i { display: block; height: 100%; }
  .ampel-balken i.rot { background: var(--farbe-krit-text); }
  .ampel-balken i.gelb { background: var(--farbe-warn-marke); }
  .ampel-balken i.gruen { background: var(--farbe-ok-text); }
  .ampel-balken i.frei { background: var(--farbe-frei-rand); }
  .ampel-zelle .zahlen { font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
  .ampel-zelle .zahlen .rot { color: var(--farbe-krit-text); font-weight: 600; }
  .ampel-zelle .zahlen .gelb { color: var(--farbe-warn-text); font-weight: 600; }
  .ampel-zelle .zahlen .gruen { color: var(--farbe-ok-text); }
  .ampel-zelle .zahlen .frei { color: var(--farbe-text-3); }
  .verstoss-zelle { font-variant-numeric: tabular-nums; color: var(--farbe-text-2); white-space: nowrap; }
  .verstoss-zelle b { color: var(--farbe-krit-text); }

  /* ---- Ampel-Sprache (U6): EIN Statuszeichen ueberall ----
     Vorher war der Status dreimal verschieden kodiert: Kartenrand,
     blasses ✓/!/✗ in der Rand-Tonstufe AUF der Gruppenfarbe (kaum
     lesbar), Text im Panel. Jetzt derselbe Volltonpunkt an Karte,
     Badge, Panelzeile, Stapelkopf und in der Legende. "ohne Regel"
     ist ein hohler Kreis - kein Status, sondern dessen Abwesenheit. */
  .status-punkt {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex: none;
    font-size: 10px;
    line-height: 1;
    font-weight: 700;
    color: var(--farbe-flaeche);
    background: var(--farbe-frei-rand);
    box-sizing: border-box;
  }
  .status-punkt.rot { background: var(--farbe-krit-text); }
  .status-punkt.gelb { background: var(--farbe-warn-marke); color: var(--farbe-text); }
  .status-punkt.gruen { background: var(--farbe-ok-text); }
  .status-punkt.frei { background: transparent; border: 1px solid var(--farbe-frei-rand); }
  .legende {
    margin-left: auto;
    display: flex;
    gap: var(--mass-3);
    color: var(--farbe-text-2);
  }
  .legende span { display: inline-flex; align-items: center; gap: var(--mass-05); }
  #controls label {
    display: flex;
    align-items: center;
    gap: var(--mass-1);
    cursor: pointer;
  }
  /* ---- Hauptbereich: Panel-Seitenleiste + Board (U1) ---- */
  #haupt {
    display: flex;
    gap: var(--mass-3);
    align-items: flex-start;
  }
  #panel {
    flex: 0 0 17rem;
    border: 1px solid var(--farbe-linie);
    border-radius: var(--radius-l);
    font-size: var(--t-basis);
    max-height: 75vh;
    overflow-y: auto;
    background: var(--farbe-flaeche);
  }
  #panel .sektion {
    padding: var(--mass-2) var(--mass-3) var(--mass-05);
    font-weight: 700;
    font-size: var(--t-mikro);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--farbe-text-3);
    background: var(--farbe-flaeche-2);
    border-top: 1px solid var(--farbe-linie);
  }
  #panel .sektion:first-child { border-top: none; }
  .gruppe-zeile {
    display: flex;
    line-height: var(--lh-eng);
    align-items: center;
    gap: var(--mass-2);
    padding: var(--dichte-pad-y) var(--mass-3);
    min-height: var(--dichte-zeile);
    box-sizing: border-box;
    cursor: pointer;
    transition: background var(--uebergang);
  }
  .gruppe-zeile:hover { background: var(--zustand-hover); }
  .gruppe-zeile.aktiv, .gruppe-zeile.hl { background: var(--farbe-akzent-flaeche); }
  .gruppe-zeile .kuerzel {
    flex: 0 0 auto;
    min-width: 2.4rem;
    text-align: center;
    border-radius: var(--radius-s);
    font-weight: 700;
    font-size: var(--t-mikro);
    padding: 1px var(--mass-1);
    color: var(--farbe-flaeche);
  }
  .gruppe-zeile .typ { color: var(--farbe-text-2); flex: 0 0 auto; }
  .gruppe-zeile .status { flex: 0 0 auto; font-size: var(--t-klein); display: inline-flex; align-items: center; gap: var(--mass-05); }
  .status.s-verletzt { color: var(--farbe-krit-text); font-weight: 600; }
  .status.s-knapp { color: var(--farbe-warn-text); font-weight: 600; }
  .status.s-ok { color: var(--farbe-ok-text); }
  .gruppe-zeile .name {
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--farbe-text);
  }
  /* Mini-Balken: Ist-Verteilung ueber die Klassen. */
  .mini-balken {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 1px;
    height: 14px;
  }
  /* Segmente in Ampelfarbe (U6): erfuellt gruen, Kappe voll gelb, ueber
     der Kappe oder zerrissen rot, leere Klasse neutral - dieselbe
     Sprache wie die Punkte, nicht mehr nur Hoehe. */
  .mini-balken i {
    display: block;
    width: 5px;
    background: var(--farbe-ok-text);
    border-radius: 1px 1px 0 0;
  }
  .mini-balken i.ueber { background: var(--farbe-krit-text); }
  .mini-balken i.voll { background: var(--farbe-warn-marke); }
  .mini-balken i.leer { background: var(--farbe-frei-rand); }
  /* Pin und Schloss erscheinen erst beim Zeigen oder Fokussieren -
     zwei Knoepfe je Zeile waren mehr Rahmen als Inhalt. focus-within
     haelt sie fuer die Tastatur erreichbar. */
  .gruppe-zeile .fixieren { flex: 0 0 auto; padding: 0 var(--mass-1); opacity: 0; transition: opacity var(--uebergang); }
  .gruppe-zeile:hover .fixieren, .gruppe-zeile:focus-within .fixieren { opacity: 1; }
  #panel .block {
    padding: var(--mass-1) var(--mass-3) var(--mass-2);
    color: var(--farbe-text-2);
  }
  #panel .block .zeile { padding: var(--mass-05) 0; display: flex; gap: var(--mass-2); align-items: center; }
  /* Balance- und Wunschzeilen, die Kinder hervorheben, reagieren wie
     Gruppenzeilen: Zeiger und Hintergrund ueber die volle Breite. */
  #panel .block .zeile[tabindex] {
    cursor: pointer;
    margin: 0 calc(-1 * var(--mass-3));
    padding: var(--mass-05) var(--mass-3);
    transition: background var(--uebergang);
  }
  #panel .block .zeile[tabindex]:hover, #panel .block .zeile[tabindex]:focus { background: var(--zustand-hover); }

  /* ---- Board (U1/U2) ---- */
  #board {
    flex: 1 1 auto;
    display: flex;
    gap: var(--mass-2);
    align-items: flex-start;
    overflow-x: auto;
  }
  .klasse-spalte {
    flex: 1 1 0;
    min-width: 14rem;
    border: 1px solid var(--farbe-linie);
    border-radius: var(--radius-l);
    background: var(--farbe-flaeche-2);
  }
  .klasse-kopf {
    padding: var(--mass-2) var(--mass-3);
    border-bottom: 1px solid var(--farbe-linie);
    background: var(--farbe-flaeche);
    border-radius: var(--radius-l) var(--radius-l) 0 0;
  }
  .klasse-kopf .name-zeile {
    display: flex;
    align-items: center;
    gap: var(--mass-2);
  }
  .klasse-kopf .name { font-weight: 600; flex: 1 1 auto; }
  /* Kapazitaetsbalken: Fuellstand relativ zu max_groesse. */
  .kapazitaet {
    height: 6px;
    background: var(--farbe-linie);
    border-radius: var(--radius-s);
    margin: var(--mass-1) 0 var(--mass-05);
    position: relative;
    overflow: hidden;
  }
  .kapazitaet i {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: var(--farbe-akzent);
  }
  .kapazitaet.ausserhalb i { background: var(--farbe-krit-text); }
  /* Balance je Regel als Balken mit Zielband (U6) statt drei Textzeilen:
     der Balken endet im Band = erfuellt, am Rand = knapp, ausserhalb =
     verletzt. Die Zahlen stehen im Tooltip. */
  .klasse-kopf .kennzahl {
    font-size: var(--t-mikro);
    color: var(--farbe-text-2);
    display: grid;
    grid-template-columns: minmax(0, 1fr) 4.5rem 1.4rem;
    align-items: center;
    gap: var(--mass-1);
  }
  .klasse-kopf .kennzahl.verletzt { color: var(--farbe-krit-text); font-weight: 600; }
  .klasse-kopf .kennzahl .kz-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .klasse-kopf .kennzahl .kz-wert { text-align: right; font-variant-numeric: tabular-nums; }
  .kz-balken {
    position: relative;
    height: 8px;
    background: var(--farbe-flaeche-3);
    border-radius: var(--radius-s);
    overflow: hidden;
  }
  .kz-balken .band { position: absolute; top: 0; bottom: 0; background: var(--farbe-ok-rand); }
  .kz-balken .ist { position: absolute; top: 2px; bottom: 2px; left: 0; background: var(--farbe-ok-text); border-radius: 1px; }
  .kz-balken .ist.gelb { background: var(--farbe-warn-marke); }
  .kz-balken .ist.rot { background: var(--farbe-krit-text); }
  .karten {
    padding: var(--mass-2);
    display: flex;
    flex-direction: column;
    gap: var(--dichte-gap);
  }
  /* Buendelungs-Stapel (U2): Karten derselben Gruppe im Gruppenrahmen. */
  .stapel {
    border: 2px solid;
    border-radius: var(--radius-m);
    padding: var(--mass-1);
  }
  /* Stapelkopf einzeilig (U6): Kuerzel, Statuspunkt, x/y - der Name
     steht im Tooltip, das Kuerzel traegt ihn bereits. */
  .stapel .stapel-kopf {
    font-size: var(--t-mikro);
    font-weight: 700;
    padding: 0 var(--mass-05) var(--mass-05);
    display: flex;
    align-items: center;
    gap: var(--mass-1);
    cursor: pointer;
  }
  .stapel .stapel-kopf .kuerzel {
    border-radius: var(--radius-s);
    padding: 0 var(--mass-1);
    color: var(--farbe-flaeche);
  }
  .stapel .stapel-kopf .anzahl { font-weight: 400; color: var(--farbe-text-2); font-variant-numeric: tabular-nums; }
  .stapel .stapel-kopf .zerrissen { color: var(--farbe-krit-text); }
  .stapel .stapel-kopf .pfeil { margin-left: auto; color: var(--farbe-text-3); font-weight: 400; }
  .stapel .karten-innen {
    display: flex;
    flex-direction: column;
    gap: var(--dichte-gap);
  }
  /* Eingeklappter Stapel (U6): vollstaendig hier und ohne
     Diskussionsbedarf - dann reichen Punkt und Id, nebeneinander. Die
     Karten bleiben echte Karten (fokussierbar, pinnbar, ziehbar). */
  .stapel.zu .karten-innen { flex-direction: row; flex-wrap: wrap; }
  .stapel.zu .karte { flex: 0 0 auto; }
  .stapel.zu .karte .badges, .stapel.zu .karte .pin { display: none; }
  .stapel.zu .karte .kind-id { min-width: 0; }
  /* Enge Zeilenhoehe: die Karte ist eine Datenzeile, keine Textzeile.
     Mit --lh-basis (1,4) wuchs sie von 24 auf 28 px - der Umbau haette
     jedem, der heute kompakt arbeitet, Flaeche weggenommen. */
  /* box-sizing: --dichte-zeile ist die Gesamthoehe (siehe Token). */
  .karte {
    background: var(--farbe-flaeche);
    border: 1px solid var(--farbe-linie);
    border-left: 4px solid var(--farbe-frei-rand);
    border-radius: var(--radius-m);
    padding: var(--dichte-pad-y) var(--dichte-pad-x);
    min-height: var(--dichte-zeile);
    box-sizing: border-box;
    display: flex;
    align-items: center;
    gap: var(--mass-1);
    font-size: var(--t-basis);
    line-height: var(--lh-eng);
    position: relative;
    transition: background var(--uebergang), box-shadow var(--uebergang), opacity var(--uebergang);
  }
  /* Die Karte ist das Hauptobjekt des Boards und reagierte bisher
     ueberhaupt nicht auf den Zeiger. */
  .karte:hover { background: var(--zustand-hover); }
  /* Kreuzbezug (U6): waehrend eine Gruppe gezeigt wird, treten die
     Nicht-Mitglieder zurueck - der Blick findet die Mitglieder, statt
     Umrandungen zwischen hundert Karten zu suchen. */
  #board.gedimmt .karte:not(.hl) { opacity: 0.35; }
  .karte.agg-gruen { border-left-color: var(--farbe-ok-text); }
  .karte.agg-gelb  { border-left-color: var(--farbe-warn-marke); }
  .karte.agg-rot   { border-left-color: var(--farbe-krit-text); }
  .karte.diff { outline: 3px solid var(--farbe-diff); outline-offset: -3px; }
  .karte.hl { box-shadow: 0 0 0 2px var(--hl, var(--farbe-akzent)); }
  .karte.gepinnt { background: var(--farbe-akzent-flaeche); }
  .karte .kind-id {
    font-variant-numeric: tabular-nums;
    min-width: 3rem;
    cursor: pointer;
  }
  .karte .konsens { color: var(--farbe-akzent); font-size: var(--t-mikro); }
  .karte .pin {
    margin-left: auto;
    cursor: pointer;
    font-size: var(--t-klein);
    color: var(--farbe-text-3);
  }
  .karte .pin.an { color: var(--farbe-akzent); }
  .badges { display: flex; gap: var(--mass-05); flex-wrap: wrap; }
  /* Gruppen-Badge (U1): Grundfarbe = GRUPPE, Statuszeichen = Ampel. */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    border-radius: var(--radius-s);
    font-size: var(--t-mikro);
    font-weight: 700;
    padding: 0 var(--mass-1);
    color: var(--farbe-flaeche);
    cursor: pointer;
    line-height: 1.45;
  }
  /* Der Status im Badge ist ein kleiner Volltonpunkt (U6): Gruppenfarbe
     und Ampel bleiben getrennt lesbar, statt dass ein blasses Zeichen
     auf einer gedeckten Flaeche verschwindet. */
  .badge .st {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    font-size: 8px;
    line-height: 1;
    font-weight: 700;
    color: var(--farbe-flaeche);
  }
  .badge .st.gruen { background: var(--farbe-ok-text); }
  .badge .st.gelb  { background: var(--farbe-warn-marke); color: var(--farbe-text); }
  .badge .st.rot   { background: var(--farbe-krit-text); }
  .badge.wunsch { background: var(--farbe-frei-text); }

  /* ---- Karten-Popover (U3: F1/F2) ---- */
  #popover {
    position: absolute;
    z-index: 20;
    background: var(--farbe-flaeche);
    border: 1px solid var(--farbe-linie);
    border-radius: var(--radius-l);
    box-shadow: var(--schatten-1);
    padding: var(--mass-3);
    font-size: var(--t-klein);
    max-width: 20rem;
  }
  #popover .kopf { font-weight: 700; margin-bottom: var(--mass-1); }
  #popover ul { margin: var(--mass-05) 0 var(--mass-2) 1rem; padding: 0; }
  #popover .aktionen { display: flex; gap: var(--mass-2); flex-wrap: wrap; }

  /* ---- Fixierungen-Panel (U3) ---- */
  #fixierungen {
    margin-top: var(--mass-4);
    border: 1px solid var(--farbe-linie);
    border-radius: var(--radius-l);
    padding: var(--mass-3) var(--mass-4);
    font-size: var(--t-klein);
  }
  #fixierungen textarea {
    width: 100%;
    box-sizing: border-box;
    font-family: var(--schrift-mono);
    font-size: var(--t-mikro);
    min-height: 8rem;
    margin-top: var(--mass-2);
    border: 1px solid var(--farbe-linie-stark);
    border-radius: var(--radius-m);
    padding: var(--mass-2);
    background: var(--farbe-flaeche);
    color: var(--farbe-text);
  }
  #fixierungen .cli {
    font-family: var(--schrift-mono);
    font-size: var(--t-mikro);
    background: var(--farbe-flaeche-3);
    padding: var(--mass-1) var(--mass-2);
    border-radius: var(--radius-m);
    display: inline-block;
    margin-top: var(--mass-1);
  }
  .hinweis { color: var(--farbe-text-2); font-size: var(--t-mikro); }

  /* ---- U4: Drag & Drop + Warnbanner ---- */
  .karte[draggable="true"] { cursor: grab; }
  .karte[draggable="true"]:active { cursor: grabbing; }
  .karte.verschoben {
    border-style: dashed;
    border-color: var(--farbe-akzent);
    background: var(--farbe-akzent-flaeche);
  }
  .klasse-spalte.dropziel {
    border-color: var(--farbe-akzent);
    box-shadow: 0 0 0 2px var(--farbe-akzent-flaeche) inset;
  }
  #warnung { margin-bottom: var(--mass-3); }
  #warnung .banner {
    border: 1px solid var(--farbe-krit-rand);
    background: var(--farbe-krit-flaeche);
    color: var(--farbe-krit-text);
    border-radius: var(--radius-l);
    padding: var(--mass-2) var(--mass-3);
    font-size: var(--t-klein);
  }
  #warnung .banner.ok {
    border-color: var(--farbe-ok-rand);
    background: var(--farbe-ok-flaeche);
    color: var(--farbe-ok-text);
  }
  #warnung .banner .titel { font-weight: 700; }
  #warnung .banner ul { margin: var(--mass-05) 0 0 1.1rem; padding: 0; }
  #warnung .banner .zu {
    float: right;
    cursor: pointer;
    border: none;
    background: none;
    font-size: var(--t-basis);
    color: inherit;
    padding: 0 var(--mass-05);
    min-height: 0;
  }
</style>
</head>
<body>

<!-- Symbol-Sprite. Nur die Zeichen, die diese Seite wirklich benutzt -
     ein Vorrat "fuer spaeter" waere derselbe Friedhof, den die
     Token-Waechter verhindern. Gleichdokument-Referenzen (<use href="#...">)
     funktionieren auch unter file://, der Doppelklick-Betrieb bleibt
     also unberuehrt (arc42 8.14).

     Der Pin traegt seinen Zustand DOPPELT: schraeg und offen heisst
     "noch nicht fixiert", senkrecht und gefuellt heisst "fixiert". Es
     ist dieselbe Kontur, nur gedreht. Winkel allein waere im
     Graustufendruck knapp, Fuellung allein bei 13 px ebenso - zusammen
     ist es eindeutig. Dieselbe Doppelkodierung, die das Konzept fuer
     die Ampel als Pflicht formuliert (klassenbildung-konzept.md:419). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-pin" viewBox="0 0 16 16"><path d="M6 2h4v2.2l1.6 3.3H4.4L6 4.2V2z"/><path d="M8 7.5v5.5"/></symbol>
  <symbol id="i-pin-schraeg" viewBox="0 0 16 16"><g transform="rotate(-32 8 8)"><path d="M6 2h4v2.2l1.6 3.3H4.4L6 4.2V2z"/><path d="M8 7.5v5.5"/></g></symbol>
  <symbol id="i-schloss-zu" viewBox="0 0 16 16"><rect x="3.2" y="7" width="9.6" height="6.5" rx="1.2"/><path d="M5.5 7V4.8a2.5 2.5 0 0 1 5 0V7"/></symbol>
  <!-- Der Buegel schwingt bis rund 40 Grad ueber die Waagerechte auf -
       der Spalt zum Korpus ist damit auf einen Blick da statt nur
       angedeutet. -->
  <symbol id="i-schloss-auf" viewBox="0 0 16 16"><rect x="3.2" y="7" width="9.6" height="6.5" rx="1.2"/><path d="M5.5 7V4.8a2.5 2.5 0 0 1 4.4-1.6"/></symbol>
  <symbol id="i-buendel" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="8" height="8" rx="1.5"/><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/></symbol>
  <!-- Undo/Redo (U6): Pfeil zurueck bzw. vor mit Bogen - dieselbe Kontur
       gespiegelt, wie beim Pin nur gedreht. -->
  <symbol id="i-undo" viewBox="0 0 16 16"><path d="M6 4.5L3 7.5l3 3"/><path d="M3 7.5h6.5a3 3 0 0 1 0 6H7"/></symbol>
  <symbol id="i-redo" viewBox="0 0 16 16"><path d="M10 4.5l3 3-3 3"/><path d="M13 7.5H6.5a3 3 0 0 0 0 6H9"/></symbol>
  <symbol id="i-verteil" viewBox="0 0 16 16"><path d="M2.5 6h10M10 3.5L12.5 6 10 8.5M13.5 10h-10M6 7.5L3.5 10 6 12.5"/></symbol>
</svg>

  <h1 id="titel">Klassenbildung</h1>
  <div id="meta"></div>

  <!-- Kopfbereich (U6/D): Fortschritt, Varianten und Filter sind EIN
       Kasten mit drei Zeilen; das Warnbanner steht darunter, damit es
       den Kasten nicht aufreisst. -->
  <div id="prozess"></div>
  <div id="varianten"></div>

  <div id="controls" class="kopf-fuss">
    <label><input type="checkbox" id="filter-kritisch">nur Diskussionsbedarf (gelb/rot)</label>
    <label><input type="checkbox" id="filter-offene">nur offene (nicht fixierte) Kinder</label>
    <label><input type="checkbox" id="filter-wuensche">alle Wuensche einzeln</label>
    <label><input type="checkbox" id="konsens-toggle" checked>Konsens-Kern markieren (&#9679;)</label>
    <span id="compare-info"></span>
    <span class="legende" id="legende"></span>
  </div>
  <div id="warnung"></div>

  <div id="haupt">
    <div id="panel"></div>
    <div id="board"></div>
  </div>

  <div id="fixierungen"></div>

  <script type="application/json" id="klassenbildung-data">__KLASSENBILDUNG_JSON__</script>
  <script>
    (function () {
      var data = JSON.parse(document.getElementById('klassenbildung-data').textContent);
      var varianten = data.varianten;
      var gruppen = data.gruppen || [];
      var wuensche = data.wuensche || [];
      var bestandsFixierungen = data.fixierungen || [];
      var konsens = {};
      (data.konsens_kern || []).forEach(function (id) { konsens[id] = true; });
      var alleKinder = Object.keys(varianten[0].zuordnung);

      var labels = data.klassen_labels || [];
      function labelVon(klasse) { return labels[klasse - 1] || ('Klasse ' + klasse); }

      document.getElementById('titel').textContent = 'Klassenbildung: ' + data.schule;
      document.getElementById('meta').textContent =
        data.schueler_anzahl + ' Kinder auf ' + data.klassen_anzahl + ' Klassen (' +
        data.min_groesse + '-' + data.max_groesse + ' je Klasse) | Qualitaetsband epsilon ' + data.parameter.epsilon +
        ' | Mindestdistanz ' + data.parameter.min_distanz + ' Kinder. ' +
        'Der Solver liefert Vorschlaege - die Zuordnung entscheidet die Schulleitung.';

      // ---- Zustand -------------------------------------------------
      var aktuelleVariante = 0;       // Arbeitsstand (U2)
      var compareIndex = null;
      var highlights = {};            // gruppen-id -> true (Mehrfach-Highlight, U1)
      var stapelOffen = {};           // gruppen-id -> true/false: vom Nutzer auf-/zugeklappt (U6)
      var pins = {};                  // kind -> klasse (F1, U3; ein Pin auf eine ANDERE
                                      // Klasse als in der Basis-Variante IST die Verschiebung, U4)
      var notPins = {};               // kind -> {klasse: true} (F2)
      var pinHerkunft = {};           // kind -> 'manuell' | 'konsens' | 'verschoben' | ...
      var haertungen = { gruppen: {}, wuensche: {} }; // F5 / F3 (U4): nur Export-Direktive
      var warnungen = null;           // {titel, zeilen, ok} nach der letzten Verschiebung (U4)
      var bestandVon = {};            // kind -> klasse aus YAML-Fixierungen (nicht loesbar)
      bestandsFixierungen.forEach(function (f) {
        if (f.klasse !== null && f.klasse !== undefined) bestandVon[f.kind] = f.klasse;
      });

      // ---- Bruecke zum GUI-Host (U5) ------------------------------
      // Die Seite laeuft in ZWEI Betriebsarten, und beide muessen
      // funktionieren:
      //   * Doppelklick: keine Bruecke, Pins liegen im localStorage,
      //     Rueckweg ist der YAML-Export-Block. Das ist eine
      //     dokumentierte Zusage (arc42 8.10) und wird per Test
      //     abgesichert - deshalb ist alles hier ADDITIV und haengt an
      //     der Feature-Erkennung, statt den alten Pfad zu ersetzen.
      //   * WebView2: der Host injiziert den Zustand vor dem Laden,
      //     bekommt jede Aenderung per postMessage zurueck und ersetzt
      //     den Export-Block durch "Neu rechnen".
      var brueckeAktiv = !!(window.chrome && window.chrome.webview &&
                            typeof window.chrome.webview.postMessage === 'function');
      // Anzeige-Map (id -> "Mia M."), vom Host injiziert. Sie wird NUR
      // in den DOM gerendert; das eingebettete JSON und jeder Export
      // bleiben pseudonym (Datenhaltung 6.1/6.2).
      var anzeigeNamen = (brueckeAktiv && window.__anzeigeNamen) || {};
      function anzeigeVon(id) {
        return anzeigeNamen[id] ? anzeigeNamen[id] + ' (' + id + ')' : id;
      }
      function sende(typ, nutzlast) {
        if (!brueckeAktiv) return;
        try {
          window.chrome.webview.postMessage(JSON.stringify({ v: 1, typ: typ, nutzlast: nutzlast }));
        } catch (e) { /* Host weg - das Board bleibt trotzdem bedienbar */ }
      }
      function zustand() {
        // `basis` (U6): die gewaehlte Variante gehoert zum Zustand - Pins
        // sind relativ zu ihr gemeint, und nach einem Neuladen (Undo/Redo
        // im Host) soll dieselbe Basis stehen.
        return { pins: pins, notPins: notPins, herkunft: pinHerkunft, haertungen: haertungen, basis: aktuelleVariante };
      }
      function zustandAnwenden(st) {
        pins = st.pins || {};
        notPins = st.notPins || {};
        pinHerkunft = st.herkunft || {};
        haertungen = st.haertungen || { gruppen: {}, wuensche: {} };
        var b = parseInt(st.basis, 10);
        aktuelleVariante = (b >= 0 && b < varianten.length) ? b : 0;
      }

      // localStorage-Komfort (file:// ist unzuverlaessig - massgeblich
      // ist immer der YAML-Export). Im GUI-Betrieb uebernimmt
      // gui-state.json in der Projektdatei diese Rolle (Datenhaltung
      // 7.6), deshalb bleibt localStorage dort unberuehrt.
      var storeKey = 'klassenbildung-pins:' + data.schule;
      function ladePins() {
        var st = null;
        if (brueckeAktiv) {
          st = window.__gastZustand || null;
        } else {
          try {
            var raw = localStorage.getItem(storeKey);
            if (raw) st = JSON.parse(raw);
          } catch (e) { /* ohne Persistenz weiterarbeiten */ }
        }
        if (!st) return;
        zustandAnwenden(st);
      }
      // Nur die Browser-Persistenz. Die Nachricht an den Host und der
      // Verlaufsschritt haengen an render() (schrittMerken), damit eine
      // Bulk-Aktion mit Dutzenden Pins EIN Schritt und EINE Nachricht ist.
      function speicherePins() {
        if (brueckeAktiv) return;
        try {
          localStorage.setItem(storeKey, JSON.stringify(zustand()));
        } catch (e) { /* ignorieren */ }
      }
      ladePins();

      // ---- Undo/Redo (U6) ------------------------------------------
      // Ein Schritt = der Zustand nach einer Bedienaktion (Pin, Bulk,
      // Verschiebung, hart/weich). Erkannt wird er in render(): jede
      // Aktion rendert genau einmal. Im Doppelklick-Betrieb lebt der
      // Verlauf hier; im GUI-Betrieb fuehrt ihn der Host, weil "Neu
      // rechnen" einen neuen Stand erzeugt und die Seite neu laedt - die
      // Knoepfe senden dann undo/redo, der Host liefert Stand und
      // Zustand zurueck und meldet die Tiefe ueber window.__verlauf.
      var verlauf = { zurueck: [], vor: [] };
      var letzterZustand = JSON.stringify(zustand());
      function schrittMerken() {
        var jetzt = JSON.stringify(zustand());
        if (jetzt === letzterZustand) return;
        verlauf.zurueck.push(letzterZustand);
        verlauf.vor = [];
        letzterZustand = jetzt;
        sende('zustand', zustand());
      }
      function verlaufSpringen(richtung) {
        if (brueckeAktiv) {
          sende(richtung < 0 ? 'undo' : 'redo', {});
          return;
        }
        var von = richtung < 0 ? verlauf.zurueck : verlauf.vor;
        var nach = richtung < 0 ? verlauf.vor : verlauf.zurueck;
        if (von.length === 0) return;
        nach.push(letzterZustand);
        var s = von.pop();
        zustandAnwenden(JSON.parse(s));
        letzterZustand = s;
        speicherePins();
        warnungen = null;
        render();
      }
      function verlaufZaehler() {
        if (brueckeAktiv) {
          var h = window.__verlauf || {};
          return { zurueck: h.zurueck || 0, vor: h.vor || 0 };
        }
        return { zurueck: verlauf.zurueck.length, vor: verlauf.vor.length };
      }
      document.addEventListener('keydown', function (e) {
        if (!(e.ctrlKey || e.metaKey)) return;
        var t = e.target && e.target.tagName;
        if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
        var k = (e.key || '').toLowerCase();
        if (k === 'z' && !e.shiftKey) { e.preventDefault(); verlaufSpringen(-1); }
        else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); verlaufSpringen(1); }
      });

      // ---- Gruppen-Identitaet (U1): Farbe + Kuerzel ----------------
      // Macht ein Element per Tastatur bedienbar. Ohne `aktion` loest
      // Enter/Leertaste denselben Klick aus, den die Maus ausloesen
      // wuerde - dadurch KANN die Tastaturbedienung gar nicht von der
      // Maus abweichen, statt beides parallel pflegen zu muessen.
      //
      // Loest die Zusage aus klassenbildung-ui-konzept.md:203 ein
      // ("Fokus-Reihenfolge Panel -> Board, Pin = Enter auf fokussierter
      // Karte"). Die Reihenfolge ergibt sich aus dem DOM und laeuft
      // damit von selbst Panel -> Board.
      //
      // Badges bleiben bewusst mausgebunden: sie sitzen zu Dutzenden in
      // jeder Karte und wuerden die Tab-Kette unbrauchbar machen. Ihre
      // Funktion - eine Gruppe hervorheben - ist ueber die Panel-Zeile
      // erreichbar, und die IST fokussierbar.
      function bedienbar(el, beschriftung, aktion) {
        el.tabIndex = 0;
        el.setAttribute('role', 'button');
        if (beschriftung) el.setAttribute('aria-label', beschriftung);
        el.addEventListener('keydown', function (e) {
          if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
          e.preventDefault();
          if (aktion) aktion(); else el.click();
        });
      }

      // Symbol aus dem Sprite oben. `voll` fuellt die Kontur - beim Pin
      // bedeutet das "fixiert", waehrend die schraege, offene Variante
      // "noch nicht fixiert" heisst.
      function ikone(id, voll) {
        return '<svg class="ico' + (voll ? ' voll' : '') + '" aria-hidden="true"><use href="#' + id + '"/></svg>';
      }

      // Die Gruppenpalette kommt aus den Design-Tokens (--kat-1..16) und
      // nicht mehr aus einer eigenen Liste hier: sonst haetten Viewer und
      // WPF-Huelle zwei Wahrheiten, und der Kanon-Waechter koennte die
      // hiesige nicht sehen.
      //
      // Die alte Liste war ausserdem GESAETTIGT und verletzte damit die
      // eigene Konzeptregel: #15803d war zeichengleich mit dem Ampel-
      // Gruen, #c2410c mit dem Diff-Marker, obwohl
      // klassenbildung-ui-konzept.md:35 die Trennung "strikt" nennt und
      // entsaettigte Toene fordert.
      var palette = (function () {
        var wurzel = getComputedStyle(document.documentElement), p = [];
        for (var i = 1; i <= 16; i++) {
          var wert = wurzel.getPropertyValue('--kat-' + i).trim();
          if (wert) p.push(wert);
        }
        // Rueckfall, falls die Token-Region fehlt: lieber eine Farbe als
        // gar keine Gruppenidentitaet.
        return p.length ? p : ['#528099'];
      })();
      // Hervorhebungsfarbe fuer Regeln ohne Gruppenfarbe (Balance, Wunsch).
      var akzentFarbe = getComputedStyle(document.documentElement).getPropertyValue('--farbe-akzent').trim() || '#0f6cbd';
      var farbeVon = {};
      var kuerzelVon = {};
      var gruppeVon = {};             // id -> gruppe
      var mitgliedVon = {};           // id -> {kind: true}
      gruppen.forEach(function (g, i) {
        farbeVon[g.id] = palette[i % palette.length];
        kuerzelVon[g.id] = g.kuerzel || g.id;
        gruppeVon[g.id] = g;
        var m = {};
        g.mitglieder.forEach(function (id) { m[id] = true; });
        mitgliedVon[g.id] = m;
      });
      var gruppenVonKind = {};        // kind -> [gruppe]
      gruppen.forEach(function (g) {
        g.mitglieder.forEach(function (id) {
          (gruppenVonKind[id] = gruppenVonKind[id] || []).push(g);
        });
      });
      var wuenscheVonKind = {};
      wuensche.forEach(function (w) {
        w.kinder.forEach(function (id) {
          (wuenscheVonKind[id] = wuenscheVonKind[id] || []).push(w);
        });
      });

      var statusRang = { gruen: 0, gelb: 1, rot: 2 };
      var chipSymbol = { gruen: '✓', gelb: '!', rot: '✗' };
      // Die Stufen heissen, sie werden nicht nummeriert: im YAML ist
      // 3 die hoechste Prio (Gewicht im Solver), gelesen wird "kritisch"
      // aber als Nummer 1 - beide Zahlen nebeneinander verwirren nur.
      var prioName = { 3: 'KRITISCH', 2: 'WICHTIG', 1: 'WENN MOEGLICH' };
      var prioWort = { 3: 'kritisch', 2: 'wichtig', 1: 'wenn moeglich' };
      var prioKurz = { 3: 'krit', 2: 'wichtig', 1: 'wenn mgl.' };
      // Die Ampel in Worten - fuer Legende und Tooltips. 'frei' bleibt
      // der interne Schluessel (aggregat), heisst nach aussen aber
      // "ohne Regel": es ist kein Status, sondern dessen Abwesenheit.
      var statusName = { gruen: 'erfuellt', gelb: 'knapp', rot: 'verletzt', frei: 'ohne Regel' };

      // EIN Statuszeichen ueberall (U6): Karte, Badge, Panelzeile,
      // Stapelkopf, Legende - siehe CSS .status-punkt.
      function statusPunkt(status, titel) {
        var s = document.createElement('span');
        s.className = 'status-punkt ' + status;
        s.textContent = status === 'frei' ? '' : chipSymbol[status];
        s.title = titel || statusName[status];
        return s;
      }
      // F3/F5: Ziel-Modus einer Regel fuer den naechsten Lauf. Eine
      // weiche Regel laesst sich haerten, eine harte aufweichen - beides
      // nur als Export-Direktive (Wert 'hard' oder 'soft'; true aus
      // aelteren Zustaenden heisst 'hard'). Ohne die Gegenrichtung war
      // eine per Schloss gehaertete und neu gerechnete Regel im Viewer
      // nicht mehr zu loesen (live gemeldet 05.09.2026).
      function zielModus(basisModus, direktive) {
        if (direktive === 'soft') return 'soft';
        if (direktive) return 'hard';
        return basisModus;
      }
      function modusKnopf(basisModus, direktive, was, setze) {
        var b = document.createElement('button');
        b.className = 'fixieren';
        var ziel = zielModus(basisModus, direktive);
        b.innerHTML = ikone(ziel === 'hard' ? 'i-schloss-zu' : 'i-schloss-auf');
        if (direktive) {
          b.title = (ziel === 'hard' ? 'Haertung' : 'Aufweichung') + ' zuruecknehmen (' + was + ')';
        } else if (basisModus === 'hard') {
          b.title = was + ': Regel aufweichen (modus: soft) - erscheint als Diff-Hinweis im Export';
        } else {
          b.title = was + ': Regel hart stellen (modus: hard) - erscheint als Diff-Hinweis im Export';
        }
        b.addEventListener('click', function (e) {
          e.stopPropagation();
          if (direktive) setze(null);
          else setze(basisModus === 'hard' ? 'soft' : 'hard');
          speicherePins();
          render();
        });
        return b;
      }
      function setzeGruppenModus(gid) {
        return function (m) { if (m) haertungen.gruppen[gid] = m; else delete haertungen.gruppen[gid]; };
      }
      function setzeWunschModus(index) {
        return function (m) { if (m) haertungen.wuensche[index] = m; else delete haertungen.wuensche[index]; };
      }
      // Gruppen-Id ohne das technische Praefix - das Kuerzel steht
      // daneben, der volle Name im Tooltip.
      function kurzName(id) {
        return id.replace(/^G_/, '');
      }
      // Verstoesse je Prio-Stufe: Regeln mit Mass > 0 (aus dem Export,
      // bisher nirgends sichtbar).
      function verstoesseJePrio(v) {
        var z = { 3: 0, 2: 0, 1: 0 };
        (v.verletzungen || []).forEach(function (x) {
          if (x.mass > 0 && z.hasOwnProperty(x.prio)) z[x.prio] += 1;
        });
        return z;
      }

      function chipsJeKind(v) {
        var map = {};
        v.chips.forEach(function (c) {
          (map[c.kind] = map[c.kind] || []).push(c);
        });
        return map;
      }
      function chipStatusVon(v, kind, regelId) {
        for (var i = 0; i < v.chips.length; i++) {
          if (v.chips[i].kind === kind && v.chips[i].regel_id === regelId) return v.chips[i];
        }
        return null;
      }
      function aggregat(chips) {
        if (!chips || chips.length === 0) return 'frei';
        var worst = 'gruen';
        chips.forEach(function (c) {
          if (statusRang[c.status] > statusRang[worst]) worst = c.status;
        });
        return worst;
      }
      function ampelZaehler(v) {
        var map = chipsJeKind(v);
        var z = { rot: 0, gelb: 0, gruen: 0, frei: 0 };
        alleKinder.forEach(function (id) { z[aggregat(map[id])] += 1; });
        return z;
      }
      function istFixiert(id) {
        return pins.hasOwnProperty(id) || bestandVon.hasOwnProperty(id);
      }
      function fixierteAnzahl() {
        var n = 0;
        alleKinder.forEach(function (id) { if (istFixiert(id)) n += 1; });
        return n;
      }
      // Gruppenstatus in der aktiven Variante: verletzt > knapp > ok.
      function gruppenStatus(v, g) {
        if (g.modus === 'hard') return { klasse: 's-ok', text: 'hart' };
        var mass = 0;
        v.verletzungen.forEach(function (x) { if (x.regel_id === g.id) mass = x.mass; });
        if (mass > 0) return { klasse: 's-verletzt', text: '✗ ' + mass };
        var knapp = false;
        g.mitglieder.forEach(function (id) {
          var c = chipStatusVon(v, id, g.id);
          if (c && c.status === 'gelb') knapp = true;
        });
        return knapp ? { klasse: 's-knapp', text: '! knapp' } : { klasse: 's-ok', text: '✓' };
      }

      // ---- U4: Live-Bewertung --------------------------------------
      // Bewusstes, kommentiertes JS-Duplikat von
      // KlassenbildungQuality.Bewerte (VB) - dieselbe Formel-Duplikation
      // wie beim Gewichts-Regler des Stundentafel-Viewers. Status UND
      // Chip-Texte muessen zeichengleich zum VB-Original bleiben (der
      // Interaktionstest vergleicht beide Ausgaben exakt); die
      // unabhaengige Ground Truth bleibt der naechste CLI-Lauf.
      // Balance braucht data.balance (Treffer-IDs je Regel) - aeltere
      // JSONs ohne diesen Block laufen im reinen Anzeige-Modus weiter.
      var liveFaehig = !!(data.balance);
      function bewerte(zuordnung) {
        var verletzungen = [];
        var chips = [];
        gruppen.forEach(function (g) {
          var proKlasse = {};
          g.mitglieder.forEach(function (m) {
            proKlasse[zuordnung[m]] = (proKlasse[zuordnung[m]] || 0) + 1;
          });
          if (g.typ === 'buendelung') {
            var spread = Object.keys(proKlasse).length;
            var massB = spread - 1;
            if (g.modus === 'soft') {
              verletzungen.push({ regel_id: g.id, regel_typ: 'buendelung', prio: g.prio, mass: massB });
            }
            g.mitglieder.forEach(function (m) {
              chips.push({ kind: m, regel_id: g.id, regel_typ: 'buendelung',
                status: massB > 0 ? 'rot' : 'gruen',
                text: massB > 0
                  ? 'Buendelung ' + g.id + ': auf ' + spread + ' Klassen verteilt'
                  : 'Buendelung ' + g.id + ': alle in ' + labelVon(zuordnung[g.mitglieder[0]]) });
            });
          } else { // verteilung
            var kappe = g.max_pro_klasse;
            var massV = 0;
            Object.keys(proKlasse).forEach(function (k) { massV += Math.max(proKlasse[k] - kappe, 0); });
            if (g.modus === 'soft') {
              verletzungen.push({ regel_id: g.id, regel_typ: 'verteilung', prio: g.prio, mass: massV });
            }
            g.mitglieder.forEach(function (m) {
              var cnt = proKlasse[zuordnung[m]];
              chips.push({ kind: m, regel_id: g.id, regel_typ: 'verteilung',
                status: cnt > kappe ? 'rot' : (cnt === kappe ? 'gelb' : 'gruen'),
                text: 'Verteilung ' + g.id + ': ' + cnt + '/' + kappe + ' in dieser Klasse' +
                      (cnt === kappe ? ' - Kappe voll' : (cnt > kappe ? ' - Kappe ueberschritten' : '')) });
            });
          }
        });
        (data.balance || []).forEach(function (b) {
          var cntJeKlasse = {};
          var c;
          for (c = 1; c <= data.klassen_anzahl; c++) cntJeKlasse[c] = 0;
          b.treffer.forEach(function (id) { cntJeKlasse[zuordnung[id]] += 1; });
          var massBal = 0;
          for (c = 1; c <= data.klassen_anzahl; c++) {
            massBal += Math.max(Math.abs(cntJeKlasse[c] - b.ziel) - b.toleranz, 0);
          }
          if (b.modus === 'soft') {
            verletzungen.push({ regel_id: b.regel_id, regel_typ: 'balance', prio: b.prio, mass: massBal });
          }
          b.treffer.forEach(function (id) {
            var dev = Math.abs(cntJeKlasse[zuordnung[id]] - b.ziel);
            chips.push({ kind: id, regel_id: b.regel_id, regel_typ: 'balance',
              status: dev > b.toleranz ? 'rot' : (dev === b.toleranz && b.toleranz > 0 ? 'gelb' : 'gruen'),
              text: 'Balance ' + b.regel_id + ': ' + cntJeKlasse[zuordnung[id]] +
                    ' in dieser Klasse (Ziel ' + b.ziel + ' +/- ' + b.toleranz + ')' });
          });
        });
        wuensche.forEach(function (w) {
          var s1 = w.kinder[0];
          var s2 = w.kinder[1];
          var zusammen = zuordnung[s1] === zuordnung[s2];
          var erfuellt = w.typ === 'zusammen' ? zusammen : !zusammen;
          var regelTyp = w.typ === 'zusammen' ? 'wunsch_zusammen' : 'wunsch_getrennt';
          if (w.modus === 'soft') {
            verletzungen.push({ regel_id: w.regel_id, regel_typ: regelTyp, prio: w.prio, mass: erfuellt ? 0 : 1 });
          }
          w.kinder.forEach(function (kind) {
            chips.push({ kind: kind, regel_id: w.regel_id, regel_typ: regelTyp,
              status: erfuellt ? 'gruen' : 'rot',
              text: 'Wunsch ' + (w.typ === 'zusammen' ? 'zusammen mit' : 'getrennt von') + ' ' +
                    (kind === s1 ? s2 : s1) + ': ' + (erfuellt ? 'erfuellt' : 'nicht erfuellt') });
          });
        });
        return { verletzungen: verletzungen, chips: chips };
      }

      // Arbeits-Zuordnung (U4): die Basis-Variante, ueberlagert mit den
      // Pins - ein Pin auf eine andere Klasse IST die Verschiebung.
      // Pin loesen legt die Karte zurueck an ihren Varianten-Platz.
      function arbeitsZuordnung() {
        var v = varianten[aktuelleVariante];
        var z = {};
        alleKinder.forEach(function (id) {
          z[id] = pins.hasOwnProperty(id) ? pins[id] : v.zuordnung[id];
        });
        return z;
      }
      function verschobene() {
        var v = varianten[aktuelleVariante];
        return alleKinder.filter(function (id) {
          return pins.hasOwnProperty(id) && pins[id] !== v.zuordnung[id];
        });
      }
      // Die "Sicht" hat dieselbe Form wie eine Variante (zuordnung,
      // chips, verletzungen, balance_kennzahlen) - alle Render-Pfade
      // arbeiten unveraendert darauf, nur eben live nachgerechnet.
      function aktuelleSicht() {
        var v = varianten[aktuelleVariante];
        if (!liveFaehig) return v;
        var z = arbeitsZuordnung();
        var bew = bewerte(z);
        var bk = (data.balance || []).map(function (b) {
          var counts = [];
          for (var c = 1; c <= data.klassen_anzahl; c++) counts.push(0);
          b.treffer.forEach(function (id) { counts[z[id] - 1] += 1; });
          return { regel_id: b.regel_id, ziel: b.ziel, toleranz: b.toleranz, counts: counts };
        });
        return { index: v.index, status: v.status, objective: v.objective,
                 diff_zu_v1: v.diff_zu_v1, zuordnung: z,
                 chips: bew.chips, verletzungen: bew.verletzungen, balance_kennzahlen: bk };
      }

      // ---- U4: Verschieben (Drag & Drop -> F1-Pin) -----------------
      function verschiebe(id, zielKlasse) {
        if (!liveFaehig || bestandVon.hasOwnProperty(id)) return;
        var vorher = aktuelleSicht();
        if (vorher.zuordnung[id] === zielKlasse) return;
        setzePin(id, zielKlasse, 'verschoben');
        warnungen = baueWarnungen(id, zielKlasse, vorher, aktuelleSicht());
        render();
      }
      function baueWarnungen(id, zielKlasse, vorher, nachher) {
        var zeilen = [];
        var nZiel = 0;
        var nQuelle = 0;
        var quelle = vorher.zuordnung[id];
        alleKinder.forEach(function (k) {
          if (nachher.zuordnung[k] === zielKlasse) nZiel += 1;
          if (nachher.zuordnung[k] === quelle) nQuelle += 1;
        });
        // Kapazitaet blockiert den Drop nicht (Konzept 3.4) - der
        // Spaltenkopf wird rot, hier zusaetzlich der Klartext.
        if (nZiel > data.max_groesse) {
          zeilen.push(labelVon(zielKlasse) + ' hat jetzt ' + nZiel + ' Kinder (Korridor ' +
            data.min_groesse + '-' + data.max_groesse + ') - harte Grenze, entscheidet der Solver');
        }
        if (nQuelle < data.min_groesse) {
          zeilen.push(labelVon(quelle) + ' hat jetzt nur ' + nQuelle + ' Kinder (Korridor ' +
            data.min_groesse + '-' + data.max_groesse + ') - harte Grenze, entscheidet der Solver');
        }
        var altMass = {};
        vorher.verletzungen.forEach(function (x) { altMass[x.regel_id] = x.mass; });
        nachher.verletzungen.forEach(function (x) {
          var alt = altMass.hasOwnProperty(x.regel_id) ? altMass[x.regel_id] : 0;
          if (x.mass <= alt) return;
          // Klartext bevorzugt aus dem Chip des verschobenen Kindes
          // ("damit sind 2 SOZ-Kinder in 1c"), sonst generisch.
          var chip = null;
          nachher.chips.forEach(function (ch) {
            if (ch.kind === id && ch.regel_id === x.regel_id && ch.status === 'rot') chip = ch;
          });
          zeilen.push(chip ? 'damit: ' + chip.text
                           : x.regel_id + ' (' + x.regel_typ + '): Mass ' + alt + ' -> ' + x.mass);
        });
        return { titel: 'Verschiebung ' + id + ' → ' + labelVon(zielKlasse),
                 zeilen: zeilen, ok: zeilen.length === 0 };
      }
      function renderWarnung() {
        var c = document.getElementById('warnung');
        c.innerHTML = '';
        if (!warnungen) return;
        var banner = document.createElement('div');
        banner.className = 'banner' + (warnungen.ok ? ' ok' : '');
        var zu = document.createElement('button');
        zu.className = 'zu';
        zu.textContent = '✕';
        zu.title = 'Hinweis schliessen';
        zu.addEventListener('click', function () { warnungen = null; renderWarnung(); });
        banner.appendChild(zu);
        var titel = document.createElement('span');
        titel.className = 'titel';
        titel.textContent = warnungen.titel + (warnungen.ok ? ': keine zusaetzliche Verletzung' : '');
        banner.appendChild(titel);
        if (!warnungen.ok) {
          var ul = document.createElement('ul');
          warnungen.zeilen.forEach(function (t) {
            var li = document.createElement('li');
            li.textContent = t;
            ul.appendChild(li);
          });
          banner.appendChild(ul);
        }
        c.appendChild(banner);
      }

      // ---- Pin-Aktionen (U3) ---------------------------------------
      function setzePin(id, klasse, herkunft) {
        if (bestandVon.hasOwnProperty(id)) return; // YAML-Fixierung gewinnt
        pins[id] = klasse;
        pinHerkunft[id] = herkunft;
        speicherePins();
      }
      function loesePin(id) {
        delete pins[id];
        delete pinHerkunft[id];
        speicherePins();
      }
      function konsensFixieren() {
        var v = aktuelleSicht();
        (data.konsens_kern || []).forEach(function (id) {
          if (!istFixiert(id)) setzePin(id, v.zuordnung[id], 'konsens');
        });
        render();
      }
      function unkritischeFixieren() {
        var v = aktuelleSicht();
        var map = chipsJeKind(v);
        alleKinder.forEach(function (id) {
          var agg = aggregat(map[id]);
          if ((agg === 'gruen' || agg === 'frei') && !istFixiert(id)) {
            setzePin(id, v.zuordnung[id], 'unkritisch');
          }
        });
        render();
      }
      function gruppeFixieren(g) {
        var v = aktuelleSicht();
        g.mitglieder.forEach(function (id) {
          if (!istFixiert(id)) setzePin(id, v.zuordnung[id], 'gruppe ' + kuerzelVon[g.id]);
        });
        render();
      }
      function klasseEinfrieren(klasse) {
        var v = aktuelleSicht();
        alleKinder.forEach(function (id) {
          // Herkunft nur "eingefroren", ohne Label: die Anzeige stellt
          // das Label ohnehin davor ("Fixiert auf 1b (eingefroren)",
          // "# 1b - eingefroren") - doppelt waere es nur laenger.
          if (v.zuordnung[id] === klasse && !istFixiert(id)) setzePin(id, klasse, 'eingefroren');
        });
        render();
      }
      function allePinsLoesen() {
        pins = {}; notPins = {}; pinHerkunft = {};
        haertungen = { gruppen: {}, wuensche: {} };
        warnungen = null;
        speicherePins();
        render();
      }

      // ---- Fortschrittsleiste (U3) ---------------------------------
      function renderProzess() {
        var v = aktuelleSicht();
        var map = chipsJeKind(v);
        var offenKritisch = 0;
        alleKinder.forEach(function (id) {
          var agg = aggregat(map[id]);
          if (!istFixiert(id) && (agg === 'rot' || agg === 'gelb')) offenKritisch += 1;
        });
        var p = document.getElementById('prozess');
        p.innerHTML = '';
        function schritt(html) {
          var s = document.createElement('span');
          s.className = 'schritt';
          s.innerHTML = html;
          p.appendChild(s);
        }
        var nVerschoben = liveFaehig ? verschobene().length : 0;
        schritt('Basis: <b>Variante ' + v.index + '</b>' +
          (nVerschoben > 0 ? ' <b>+ ' + nVerschoben + ' verschoben</b>' : ''));

        // Der Trichter als Balken (D): fixiert gegen offen - mehr sagt
        // der Balken nicht, die Ampel steht in der Scorecard.
        var fix = fixierteAnzahl();
        var balken = document.createElement('span');
        balken.className = 'fortschritt';
        var segFix = document.createElement('i');
        segFix.className = 'fixiert';
        segFix.style.width = (fix / alleKinder.length * 100) + '%';
        balken.appendChild(segFix);
        balken.title = fix + ' fixiert, ' + (alleKinder.length - fix) + ' offen';
        p.appendChild(balken);

        var zaehler = document.createElement('span');
        zaehler.className = 'zaehler';
        zaehler.id = 'fix-zaehler';
        // Fixierungen aus der Eingabe (YAML bzw. Projekt) zaehlen mit -
        // und werden benannt, sonst wirkt "1 fixiert" direkt nach dem
        // ersten Lauf wie ein Versehen (Nutzerfrage 05.09.2026).
        var nBestand = Object.keys(bestandVon).length;
        zaehler.textContent = fix + ' von ' + alleKinder.length + ' Kindern fixiert' +
          (nBestand > 0 ? ' (' + nBestand + ' aus der Eingabe)' : '');
        zaehler.title = nBestand > 0
          ? nBestand + ' Fixierung(en) stammen aus den Eingaben der Klassenbildung (fixierungen:) und sind im Viewer nicht loesbar'
          : 'Im Viewer gesetzte Pins';
        p.appendChild(zaehler);
        schritt('<b>' + offenKritisch + '</b> gelb/rot offen');

        // Alle Aktionen des Boards an EINER Stelle: Bulk-Fixieren, Pins
        // loesen und - im GUI-Betrieb - Neu rechnen und Freigeben. Die
        // beiden letzten sassen bisher unten im Fixierungen-Block, wo
        // man sie nach dem Scrollen erst suchen musste.
        var knoepfe = document.createElement('span');
        knoepfe.className = 'knoepfe';
        // Undo/Redo (U6) ganz links: sie wirken auf alles, was rechts
        // davon steht - und im GUI-Betrieb auch auf "Neu rechnen".
        var vz = verlaufZaehler();
        var bUndo = document.createElement('button');
        bUndo.id = 'btn-undo';
        bUndo.innerHTML = ikone('i-undo');
        bUndo.title = 'Rueckgaengig (Strg+Z)' + (vz.zurueck > 0 ? ' - ' + vz.zurueck + ' Schritt(e)' : '');
        bUndo.setAttribute('aria-label', 'Rueckgaengig');
        bUndo.disabled = vz.zurueck === 0;
        bUndo.addEventListener('click', function () { verlaufSpringen(-1); });
        knoepfe.appendChild(bUndo);
        var bRedo = document.createElement('button');
        bRedo.id = 'btn-redo';
        bRedo.innerHTML = ikone('i-redo');
        bRedo.title = 'Wiederholen (Strg+Y)' + (vz.vor > 0 ? ' - ' + vz.vor + ' Schritt(e)' : '');
        bRedo.setAttribute('aria-label', 'Wiederholen');
        bRedo.disabled = vz.vor === 0;
        bRedo.addEventListener('click', function () { verlaufSpringen(1); });
        knoepfe.appendChild(bRedo);
        var trennerV = document.createElement('span');
        trennerV.className = 'trenner';
        knoepfe.appendChild(trennerV);
        var offeneKonsens = (data.konsens_kern || []).filter(function (id) { return !istFixiert(id); }).length;
        var bKonsens = document.createElement('button');
        bKonsens.className = brueckeAktiv ? '' : 'primaer';
        bKonsens.id = 'btn-konsens';
        bKonsens.textContent = 'Konsens-Kern fixieren (' + offeneKonsens + ')';
        bKonsens.title = 'Alle Kinder fixieren, die in jeder Variante in derselben Klasse stehen';
        bKonsens.disabled = offeneKonsens === 0;
        bKonsens.addEventListener('click', konsensFixieren);
        knoepfe.appendChild(bKonsens);
        var bUnkrit = document.createElement('button');
        bUnkrit.id = 'btn-unkritisch';
        bUnkrit.textContent = 'Alle unkritischen fixieren';
        bUnkrit.title = 'Alle gruenen Kinder und Kinder ohne Regel fixieren';
        bUnkrit.addEventListener('click', unkritischeFixieren);
        knoepfe.appendChild(bUnkrit);
        var bLoesen = document.createElement('button');
        bLoesen.id = 'btn-pins-loesen';
        bLoesen.textContent = 'Alle Pins loesen';
        bLoesen.title = 'Alle im Viewer gesetzten Pins zuruecknehmen (YAML-Fixierungen bleiben)';
        bLoesen.disabled = Object.keys(pins).length + Object.keys(notPins).length === 0;
        bLoesen.addEventListener('click', allePinsLoesen);
        knoepfe.appendChild(bLoesen);

        // U5 im GUI-Betrieb: der Export-Umweg entfaellt. Bewusst NUR
        // dieser Teil - Board, Bewertung und Trichter bleiben unveraendert
        // (gui-ui-konzept.md 4: "ersetzt NUR den Export-Teil").
        if (brueckeAktiv) {
          var trenner = document.createElement('span');
          trenner.className = 'trenner';
          knoepfe.appendChild(trenner);
          var rechnen = document.createElement('button');
          rechnen.id = 'neu-rechnen';
          rechnen.className = 'primaer';
          rechnen.textContent = 'Neu rechnen';
          rechnen.title = 'Fixierungen und Haertungen uebernehmen und den Solver neu starten';
          rechnen.addEventListener('click', function () {
            sende('neu-rechnen', { fixierungen: fixierungsListe(), haertungen: haertungen });
          });
          knoepfe.appendChild(rechnen);
          // Freigabe direkt aus dem Board (Nutzerwunsch 26.08.2026).
          // Sie sitzt NEBEN "Neu rechnen", weil beides denselben Stand
          // meint: den, der gerade angezeigt wird. Das Board entscheidet
          // nichts - Abweichungen, Begruendungspflicht und Nachweis
          // liegen im Host.
          var frei = document.createElement('button');
          frei.id = 'freigeben';
          var bereitsFrei = window.__freigabe;
          frei.textContent = bereitsFrei ? 'Erneut freigeben…' : 'Freigeben…';
          if (bereitsFrei) {
            frei.title = 'Freigegeben von ' + (bereitsFrei.person || '?') +
                         ' am ' + (bereitsFrei.zeitpunkt || '').slice(0, 10);
          }
          frei.addEventListener('click', function () {
            sende('freigabe', {});
          });
          knoepfe.appendChild(frei);
        }
        p.appendChild(knoepfe);
      }

      // ---- Scorecard-Leiste (U6, vorher Varianten-Kacheln U2) -------
      // Eine Zeile je Variante: Basis (Radio), Vergleich (Haken),
      // Zielwert, Diff, Ampelbalken, Verstoesse je Prio. Darunter der
      // Arbeitsstand, sobald Pins die Basis veraendern - so ist sichtbar,
      // was das Verschieben gebracht hat.
      function ampelZelle(z, gesamt) {
        var zelle = document.createElement('div');
        zelle.className = 'ampel-zelle';
        var balken = document.createElement('div');
        balken.className = 'ampel-balken';
        var zahlen = document.createElement('span');
        zahlen.className = 'zahlen';
        ['rot', 'gelb', 'gruen', 'frei'].forEach(function (s, k) {
          if (z[s] > 0) {
            var seg = document.createElement('i');
            seg.className = s;
            seg.style.width = (z[s] / gesamt * 100) + '%';
            seg.title = z[s] + ' ' + statusName[s];
            balken.appendChild(seg);
          }
          var n = document.createElement('span');
          n.className = s;
          n.textContent = (k > 0 ? ' · ' : '') + z[s];
          n.title = statusName[s];
          zahlen.appendChild(n);
        });
        balken.title = z.rot + ' verletzt, ' + z.gelb + ' knapp, ' + z.gruen + ' erfuellt, ' + z.frei + ' ohne Regel';
        zelle.appendChild(balken);
        zelle.appendChild(zahlen);
        return zelle;
      }
      function verstossZelle(v) {
        var z = verstoesseJePrio(v);
        var zelle = document.createElement('div');
        zelle.className = 'verstoss-zelle';
        [3, 2, 1].forEach(function (p, k) {
          if (k > 0) zelle.appendChild(document.createTextNode(' · '));
          var wert = document.createElement(z[p] > 0 ? 'b' : 'span');
          wert.textContent = prioKurz[p] + ' ' + z[p];
          wert.title = prioName[p] + ': ' + z[p] + ' Regel(n) verletzt';
          zelle.appendChild(wert);
        });
        return zelle;
      }
      function scorecardZeile(klasse, spalten) {
        var zeile = document.createElement('div');
        zeile.className = klasse;
        spalten.forEach(function (s) {
          if (typeof s === 'string') {
            var d = document.createElement('div');
            d.className = 'zeile';
            d.textContent = s;
            zeile.appendChild(d);
          } else {
            zeile.appendChild(s);
          }
        });
        return zeile;
      }
      function renderVarianten() {
        var c = document.getElementById('varianten');
        c.innerHTML = '';
        var kopf = scorecardZeile('kopfzeile', ['Basis', 'Vgl.', 'Variante', 'Zielwert', 'Diff V1', 'Schueler: verletzt · knapp · erfuellt · ohne Regel', 'Verstoesse je Prio']);
        kopf.querySelectorAll('.zeile').forEach(function (d) { d.className = ''; });
        c.appendChild(kopf);

        varianten.forEach(function (v, i) {
          var basis = document.createElement('input');
          basis.type = 'radio';
          basis.name = 'basis';
          basis.checked = (i === aktuelleVariante);
          basis.title = 'Variante ' + v.index + ' als Arbeitsstand uebernehmen';
          basis.tabIndex = -1;
          var vgl = document.createElement('input');
          vgl.type = 'checkbox';
          vgl.checked = (compareIndex === i);
          vgl.disabled = (i === aktuelleVariante);
          vgl.title = i === aktuelleVariante ? 'Die Basis vergleicht sich nicht mit sich selbst'
                                             : 'Mit Variante ' + v.index + ' vergleichen (abweichende Karten werden markiert)';
          vgl.tabIndex = -1;
          vgl.addEventListener('click', function (e) {
            e.stopPropagation();
            compareIndex = (compareIndex === i) ? null : i;
            render();
          });
          var name = document.createElement('div');
          name.className = 'kopf';
          name.textContent = 'Variante ' + v.index + ' · ' + v.status;
          var k = scorecardZeile('variante-kachel' + (i === aktuelleVariante ? ' active' : (compareIndex === i ? ' compare' : '')),
            [basis, vgl, name, String(v.objective), String(v.diff_zu_v1), ampelZelle(ampelZaehler(v), alleKinder.length), verstossZelle(v)]);
          k.title = 'Als Arbeitsstand uebernehmen';
          bedienbar(k, 'Variante ' + v.index + ' uebernehmen');
          k.addEventListener('click', function () {
            aktuelleVariante = i;
            render();
          });
          c.appendChild(k);
        });

        var nVerschoben = liveFaehig ? verschobene().length : 0;
        if (nVerschoben > 0) {
          var s = aktuelleSicht();
          var nameA = document.createElement('div');
          nameA.className = 'kopf';
          nameA.textContent = 'Arbeitsstand';
          var leer1 = document.createElement('span');
          var leer2 = document.createElement('span');
          var a = scorecardZeile('arbeits-zeile',
            [leer1, leer2, nameA, '', nVerschoben + ' versch.', ampelZelle(ampelZaehler(s), alleKinder.length), verstossZelle(s)]);
          a.title = 'Basis Variante ' + s.index + ' mit ' + nVerschoben + ' verschobenen Kindern - live bewertet';
          c.appendChild(a);
        }
      }

      // ---- Legende (U6): dieselben Punkte wie ueberall --------------
      (function () {
        var l = document.getElementById('legende');
        if (!l) return;
        ['rot', 'gelb', 'gruen', 'frei'].forEach(function (s) {
          var e = document.createElement('span');
          e.appendChild(statusPunkt(s));
          e.appendChild(document.createTextNode(statusName[s]));
          l.appendChild(e);
        });
      })();
      function updateCompareInfo() {
        var info = document.getElementById('compare-info');
        if (compareIndex === null || compareIndex === aktuelleVariante) {
          info.textContent = '';
          return;
        }
        var a = aktuelleSicht().zuordnung;
        var b = varianten[compareIndex].zuordnung;
        var n = 0;
        alleKinder.forEach(function (id) { if (a[id] !== b[id]) n += 1; });
        info.textContent = n + ' Kinder anders zugeordnet als in Variante ' + varianten[compareIndex].index + ' (markiert).';
      }

      document.getElementById('filter-kritisch').addEventListener('change', render);
      document.getElementById('filter-offene').addEventListener('change', render);
      document.getElementById('filter-wuensche').addEventListener('change', render);
      document.getElementById('konsens-toggle').addEventListener('change', render);

      // ---- Panel-Seitenleiste (U1): Prio-Sektionen -----------------
      function renderPanel() {
        var v = aktuelleSicht();
        var panel = document.getElementById('panel');
        panel.innerHTML = '';

        [3, 2, 1].forEach(function (prio) {
          var inStufe = gruppen.filter(function (g) { return g.prio === prio; });
          if (inStufe.length === 0) return;
          var kopf = document.createElement('div');
          kopf.className = 'sektion';
          kopf.textContent = prioName[prio];
          panel.appendChild(kopf);
          // Tagesordnung: verletzte zuerst, dann knappe, dann erfuellte.
          var rangVon = { 's-verletzt': 0, 's-knapp': 1, 's-ok': 2 };
          inStufe.map(function (g) { return { g: g, st: gruppenStatus(v, g) }; }).
            sort(function (a, b) { return rangVon[a.st.klasse] - rangVon[b.st.klasse] || a.g.id.localeCompare(b.g.id); }).
            forEach(function (e) {
              panel.appendChild(baueGruppenZeile(v, e.g, e.st));
            });
        });

        // Balance-Block mit Mini-Balken (Ziel +/- Toleranz).
        if ((v.balance_kennzahlen || []).length > 0) {
          var kopfB = document.createElement('div');
          kopfB.className = 'sektion';
          kopfB.textContent = 'BALANCE';
          panel.appendChild(kopfB);
          var blockB = document.createElement('div');
          blockB.className = 'block';
          v.balance_kennzahlen.forEach(function (b) {
            var zeile = document.createElement('div');
            zeile.className = 'zeile';
            var balken = baueMiniBalken(b.counts, function (count) {
              var dev = Math.abs(count - b.ziel);
              return dev > b.toleranz ? 'ueber' : (dev === b.toleranz && b.toleranz > 0 ? 'voll' : '');
            }, function (count, idx) {
              return labelVon(idx + 1) + ': ' + count + ' (Ziel ' + b.ziel + ' ± ' + b.toleranz + ')';
            });
            var text = document.createElement('span');
            text.textContent = b.regel_id + ' (Ziel ' + b.ziel + ' ± ' + b.toleranz + ')';

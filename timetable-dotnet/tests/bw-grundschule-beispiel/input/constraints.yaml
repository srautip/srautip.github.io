# Code-Review-Umsetzung P1: kompaktes Dichte-Kriterium statt der
# frueheren Batterie aus 140 occupied_slot-Kann-Regeln (eine pro Slot).
# Ein occupied_window-Objekt beschreibt ein ganzes Belegungsfenster
# (alle Tage x from_period..to_period); als "should" erzeugt es KEINE
# Kann-BoolVars, sondern zaehlt jedes unbelegte Fenster-Slot als
# Dichte-Defizit in der Rest-Zielfunktion (Gewicht quality_weights.
# occupied_density, hier 100 = der fruehere Kann-Gewichtswert der
# Batterie). Abgedeckte Fenster identisch zur abgeloesten Batterie:
# Klasse 1/2 taeglich Stunde 2-4, Klasse 3/4 taeglich Stunde 2-5.
# occupied_slot bleibt als Typ weiterhin verfuegbar (fuer gezielte
# Einzel-Slots); Messvergleich beider Varianten: siehe config.yaml.
- type: occupied_window
  scope: class
  entity: 1a
  from_period: 2
  to_period: 4
  priority: should
  reason: "1./2. Klasse soll taeglich Stunde 2-4 belegt sein"
- type: occupied_window
  scope: class
  entity: 1b
  from_period: 2
  to_period: 4
  priority: should
  reason: "1./2. Klasse soll taeglich Stunde 2-4 belegt sein"
- type: occupied_window
  scope: class
  entity: 2a
  from_period: 2
  to_period: 4
  priority: should
  reason: "1./2. Klasse soll taeglich Stunde 2-4 belegt sein"
- type: occupied_window
  scope: class
  entity: 2b
  from_period: 2
  to_period: 4
  priority: should
  reason: "1./2. Klasse soll taeglich Stunde 2-4 belegt sein"
- type: occupied_window
  scope: class
  entity: 3a
  from_period: 2
  to_period: 5
  priority: should
  reason: "3./4. Klasse soll taeglich Stunde 2-5 belegt sein"
- type: occupied_window
  scope: class
  entity: 3b
  from_period: 2
  to_period: 5
  priority: should
  reason: "3./4. Klasse soll taeglich Stunde 2-5 belegt sein"
- type: occupied_window
  scope: class
  entity: 4a
  from_period: 2
  to_period: 5
  priority: should
  reason: "3./4. Klasse soll taeglich Stunde 2-5 belegt sein"
- type: occupied_window
  scope: class
  entity: 4b
  from_period: 2
  to_period: 5
  priority: should
  reason: "3./4. Klasse soll taeglich Stunde 2-5 belegt sein"


# Code-Review-Umsetzung P1: kompaktes Dichte-Kriterium statt der
# frueheren Batterie aus 720 occupied_slot-Kann-Regeln (24 Klassen x 5
# Tage x Std. 1-6, eine Regel pro Slot). Ein occupied_window-Objekt je
# Klasse deckt dasselbe Fenster ab; als "should" zaehlt jeder unbelegte
# Fenster-Slot als Dichte-Defizit in der Rest-Zielfunktion
# (quality_weights.occupied_density, hier 100 = das fruehere
# Kann-Gewicht der Batterie) statt einer eigenen Kann-BoolVar pro Slot.

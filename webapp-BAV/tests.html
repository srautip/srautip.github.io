<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testfälle – Versorgungsausgleich bAV</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="app-header">
  <h1>Testfälle</h1>
  <p class="sub">Prüft die Hilfsfunktionen und die Testfälle aus Abschnitt 6 der Spezifikation.</p>
  <div class="toolbar"><a class="btn" href="index.html">← zur Anwendung</a></div>
</header>
<main class="layout" style="grid-template-columns:minmax(0,1fr);">
  <section class="card">
    <header><h2>Ergebnis</h2><span class="legal" id="zusammenfassung"></span></header>
    <div class="body" id="ausgabe"></div>
  </section>
</main>
<script src="js/engine.js"></script>
<script src="js/config.js"></script>
<script src="js/examples.js"></script>
<script src="js/hilfe.js"></script>
<script src="js/tests.js"></script>
<script>
(function () {
  var erg = window.BAV.tests.run();
  var fehler = erg.filter(function (r) { return !r.ok; }).length;
  document.getElementById('zusammenfassung').textContent =
    (erg.length - fehler) + ' von ' + erg.length + ' Tests bestanden';
  var out = document.getElementById('ausgabe');
  erg.forEach(function (r) {
    var d = document.createElement('div');
    d.className = 'befund ' + (r.ok ? 'INFO' : 'ERROR');
    d.innerHTML = '<div class="kopf"><span class="badge ' + (r.ok ? 'ok' : 'error') + '">' +
      (r.ok ? 'bestanden' : 'fehlgeschlagen') + '</span><span class="titel"></span></div>';
    d.querySelector('.titel').textContent = r.name;
    if (!r.ok) {
      var p = document.createElement('p');
      p.className = 'text';
      p.textContent = r.fehler;
      d.appendChild(p);
    }
    out.appendChild(d);
  });
})();
</script>
</body>
</html>

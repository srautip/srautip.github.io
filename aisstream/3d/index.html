<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIS 3D — Schiffsspur über dem Hafen</title>
<!--
  Eine eigene Seite, absichtlich.

  CesiumJS wiegt 1 408 KB auf der Leitung (gzip, gemessen am 28. Aug. 2026).
  Läge es im Hauptclient, zahlte jeder Seitenaufruf dafür — auch auf dem
  Telefon, das diese Ansicht nie öffnet. So kostet es nur, wer sie aufruft.

  Kein Build, alles inline — dieselbe Regel wie in ../index.html.
-->
<style>
  :root {
    --bg: #0f1720; --panel: #17202b; --rand: #26303d;
    --text: #e7edf4; --gedimmt: #8fa0b4; --akzent: #4aa3ff; --warn: #e2b53c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%; overflow: hidden; }
  #cesium { position: absolute; inset: 0; }
  /* Cesium malt sonst einen hellen Rahmen um das Kreditfeld. */
  .cesium-widget-credits { font-size: 11px; }

  header { position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; gap: .6rem; align-items: center; padding: .5rem .75rem;
    padding-top: max(.5rem, env(safe-area-inset-top));
    pointer-events: none; }
  header > * { pointer-events: auto; }
  /* Kein Verlauf: Der Untergrund ist hier eine Luftaufnahme und oft HELL -
     ein Farbverlauf nach Dunkel traegt die Schrift dann nicht. Der Kasten
     traegt auf jedem Grund. Gemessen an einem Schirmfoto ueber Bremerhaven,
     auf dem die Unterzeile unlesbar war. */
  .kopfblock { min-width: 0; flex: 1; background: rgba(15,23,32,.82);
    border: 1px solid var(--rand); border-radius: 9px; padding: .28rem .6rem; }
  #titel { font-weight: 600; font-size: 15px; }
  #unter { color: var(--gedimmt); font-size: 12px; }
  .kopfblock div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a.knopf, button.knopf {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 34px; padding: 0 .7rem; border-radius: 8px; cursor: pointer;
    background: var(--panel); color: var(--text); border: 1px solid var(--rand);
    text-decoration: none; font: inherit; }
  @media (pointer: coarse) { a.knopf, button.knopf { min-height: 44px; } }
  a.knopf:hover, button.knopf:hover { border-color: var(--akzent); }

  #tafel { position: absolute; z-index: 10; right: .75rem; width: 280px; max-width: calc(100vw - 1.5rem);
    top: 52px; top: calc(52px + env(safe-area-inset-top));
    background: rgba(23,32,43,.95); border: 1px solid var(--rand); border-radius: 10px;
    padding: .7rem .75rem; display: none; max-height: 70vh; overflow: auto;
    overscroll-behavior: contain; }
  #tafel.auf { display: block; }
  #tafel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--gedimmt); margin: .2rem 0 .45rem; font-weight: 600; }
  #tafel label { display: block; margin: .5rem 0 .2rem; color: var(--gedimmt); font-size: 12px; }
  #tafel input[type=text], #tafel input[type=password], #tafel select {
    width: 100%; font-size: 16px; padding: .4rem .5rem; border-radius: 7px;
    background: #101822; color: var(--text); border: 1px solid var(--rand); }
  #tafel p { margin: .5rem 0 0; color: var(--gedimmt); font-size: 12px; }
  .zustand { display: inline-block; padding: .1rem .45rem; border-radius: 6px;
    font-size: 11px; border: 1px solid var(--rand); }
  .zustand.gut { color: #8fe08f; border-color: #2f5c34; }
  .zustand.warn { color: var(--warn); border-color: #5c4a1f; }
  .zustand.schlecht { color: #ff9d9d; border-color: #5c2f2f; }
  #werte { margin-top: .6rem; font-variant-numeric: tabular-nums; color: var(--gedimmt);
    font-size: 12px; }
  #werte b { color: var(--text); font-weight: 600; }

  #meldung { position: absolute; z-index: 11; left: 50%; top: 50%;
    transform: translate(-50%, -50%); text-align: center; max-width: min(90vw, 460px);
    background: rgba(23,32,43,.96); border: 1px solid var(--rand); border-radius: 12px;
    padding: 1rem 1.1rem; }
  #meldung.weg { display: none; }
  #meldung h1 { font-size: 16px; margin: 0 0 .4rem; }
  #meldung p { margin: .3rem 0; color: var(--gedimmt); font-size: 13px; }
</style>
</head>
<body>
<div id="cesium"></div>

<header>
  <a class="knopf" id="zurueck" href="../" title="Zurück zur Karte">←</a>
  <div class="kopfblock">
    <div id="titel">…</div>
    <div id="unter"></div>
  </div>
  <button class="knopf" id="tafelKnopf" aria-expanded="false">⚙</button>
</header>

<div id="tafel">
  <h2>Höhe der Spur</h2>
  <select id="hoehenModus">
    <option value="zeit">Zeit — älteste Punkte unten</option>
    <option value="sog">Geschwindigkeit</option>
    <option value="flach">flach auf dem Wasser</option>
  </select>

  <h2 style="margin-top:.9rem">Photorealistische Kacheln</h2>
  <div id="keyZustand" class="zustand warn">kein Schlüssel</div>
  <label for="googleKey">Google-Maps-Schlüssel</label>
  <input id="googleKey" type="password" autocomplete="off" spellcheck="false"
         placeholder="AIza…">
  <button class="knopf" id="keyUebernehmen" style="margin-top:.5rem">Übernehmen</button>
  <p>Kostet Geld. Vorher im Cloud Console eine <b>Referrer-Beschränkung</b> auf
     diese Seite setzen und einen <b>Kontingentdeckel</b> — der Schlüssel steht
     danach im Browser, nicht im Quelltext.</p>

  <div id="werte"></div>
</div>

<div id="meldung"><h1>Wird geladen…</h1><p id="meldungText">Cesium und die Spur</p></div>

<script>
(function () {
  "use strict";

  // --- Parameter und Speicher ------------------------------------------
  var P = new URLSearchParams(location.search);
  var MMSI = (P.get("mmsi") || "").replace(/\D/g, "");
  var STUNDEN = Math.min(24, Math.max(1, Number(P.get("stunden")) ||
    Number(hole("aisstream_track_stunden")) || 6));

  // Derselbe Ursprung wie der Hauptclient, also derselbe localStorage -
  // Proxyadresse und Token stehen schon da, ein zweites Feld waere doppelt.
  var PROXY_VORGABE = "https://8244a7c9-68a8-4828-b121-e974a0dc6f28.clouding.host/v1";
  var TOKEN_VORGABE = "uqpKrAIyhiVmFPkV6md62ocJr7t9Iewp";

  // Cesium kommt vom CDN. `?cesium=` ist der Haken fuer die Probe: In der
  // Sandbox kommt der Browser per HTTPS nicht nach draussen, dort liegt ein
  // ausgepacktes Cesium unter demselben Ursprung.
  var CESIUM_BASIS = P.get("cesium") ||
    "https://cdn.jsdelivr.net/npm/cesium@1.123.1/Build/Cesium/";

  // Die Bandhoehe ist KEINE feste Zahl, sondern ein Anteil der Ausdehnung der
  // Spur. Mit festen 500 m stand ueber einer 1,5-km-Fahrt eine fast
  // senkrechte Wand - auf dem Schirmfoto ein Strich, keine Kurve.
  var HOEHE_ANTEIL = 0.28;      // vom Durchmesser der Spur
  var HOEHE_MIN = 60, HOEHE_OBEN = 900;
  var hoeheMax = 300;           // wird aus der Spur gerechnet
  var SOG_MAX = 25;             // Knoten, Bezug fuer den Geschwindigkeitsmodus

  function hole(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function setze(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function proxyBasis() {
    var u = (hole("aisstream_proxy_url") || "").trim().replace(/\/+$/, "");
    return u || PROXY_VORGABE;
  }
  function proxyToken() {
    var t = hole("aisstream_proxy_token");
    return t === null ? TOKEN_VORGABE : t.trim();
  }
  function mitToken(url) {
    var t = proxyToken();
    if (!t) return url;
    return url + (url.indexOf("?") === -1 ? "?" : "&") + "token=" + encodeURIComponent(t);
  }

  var el = {
    titel: document.getElementById("titel"),
    unter: document.getElementById("unter"),
    tafel: document.getElementById("tafel"),
    tafelKnopf: document.getElementById("tafelKnopf"),
    hoehenModus: document.getElementById("hoehenModus"),
    googleKey: document.getElementById("googleKey"),
    keyUebernehmen: document.getElementById("keyUebernehmen"),
    keyZustand: document.getElementById("keyZustand"),
    werte: document.getElementById("werte"),
    meldung: document.getElementById("meldung"),
    meldungText: document.getElementById("meldungText"),
    zurueck: document.getElementById("zurueck")
  };

  function meldung(titel, text) {
    el.meldung.classList.remove("weg");
    el.meldung.querySelector("h1").textContent = titel;
    el.meldungText.textContent = text || "";
  }
  function meldungWeg() { el.meldung.classList.add("weg"); }

  el.tafelKnopf.addEventListener("click", function () {
    var auf = el.tafel.classList.toggle("auf");
    el.tafelKnopf.setAttribute("aria-expanded", auf ? "true" : "false");
  });

  // --- Cesium nachladen -------------------------------------------------
  //
  // CESIUM_BASE_URL muss VOR dem Skript stehen: Cesium laedt 100 Worker- und
  // 205 Asset-Dateien zur Laufzeit nach und findet sie sonst nicht. Ein
  // schwarzer Globus mit 404ern in der Konsole ist die uebliche Folge.
  window.CESIUM_BASE_URL = CESIUM_BASIS;

  function ladeCesium() {
    return new Promise(function (fertig, schief) {
      var css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = CESIUM_BASIS + "Widgets/widgets.css";
      document.head.appendChild(css);
      var s = document.createElement("script");
      s.src = CESIUM_BASIS + "Cesium.js";
      s.onload = function () { fertig(window.Cesium); };
      s.onerror = function () { schief(new Error("Cesium nicht ladbar: " + s.src)); };
      document.head.appendChild(s);
    });
  }

  // --- Die Spur aus dem Proxy ------------------------------------------
  function holeSpur() {
    var von = Math.floor(Date.now() / 1000) - STUNDEN * 3600;
    return fetch(mitToken(proxyBasis() + "/track?mmsi=" + encodeURIComponent(MMSI) +
      "&von=" + von)).then(function (r) {
        if (!r.ok) throw new Error("Spur: HTTP " + r.status);
        return r.json();
      });
  }
  function holeSchiff() {
    return fetch(mitToken(proxyBasis() + "/ship/" + encodeURIComponent(MMSI)))
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
  }

  // [t, lat*1e6, lon*1e6, sog*10, cog*10] - dieselbe Form wie im Hauptclient.
  function punkteLesen(d) {
    var aus = [];
    var roh = (d && d.punkte) || [];
    for (var i = 0; i < roh.length; i++) {
      var p = roh[i];
      if (!p || p.length < 3) continue;
      aus.push({
        t: p[0] * 1000,
        lat: p[1] / 1e6,
        lon: p[2] / 1e6,
        sog: p[3] == null ? null : p[3] / 10,
        cog: p[4] == null ? null : p[4] / 10
      });
    }
    aus.sort(function (a, b) { return a.t - b.t; });
    return aus;
  }

  function hoeheFuer(p, modus, t0, t1) {
    if (modus === "flach") return 0;
    if (modus === "sog") {
      var s = p.sog == null ? 0 : Math.min(p.sog, SOG_MAX);
      return (s / SOG_MAX) * hoeheMax;
    }
    if (t1 <= t0) return 0;
    return ((p.t - t0) / (t1 - t0)) * hoeheMax;
  }

  // Grobe Entfernung in Metern - fuer den Massstab reicht die Naeherung.
  function meter(a, b) {
    var dLat = (b.lat - a.lat) * 111320;
    var dLon = (b.lon - a.lon) * 111320 * Math.cos(a.lat * Math.PI / 180);
    return Math.sqrt(dLat * dLat + dLon * dLon);
  }

  function hoeheEichen() {
    if (spurPunkte.length < 2) { hoeheMax = HOEHE_MIN; return; }
    var latMin = 90, latMax = -90, lonMin = 180, lonMax = -180;
    for (var i = 0; i < spurPunkte.length; i++) {
      var p = spurPunkte[i];
      if (p.lat < latMin) latMin = p.lat;
      if (p.lat > latMax) latMax = p.lat;
      if (p.lon < lonMin) lonMin = p.lon;
      if (p.lon > lonMax) lonMax = p.lon;
    }
    var d = meter({ lat: latMin, lon: lonMin }, { lat: latMax, lon: lonMax });
    hoeheMax = Math.max(HOEHE_MIN, Math.min(HOEHE_OBEN, d * HOEHE_ANTEIL));
  }

  // --- Aufbau -----------------------------------------------------------
  var viewer = null, Cesium = null, spurPunkte = [], schiff = null;
  var bandEntity = null, wandEntity = null, bodenEntity = null, schiffEntity = null;
  var googleTileset = null;

  function farbeFuerTyp(typ) {
    // Dieselben Kategoriefarben wie die Karte im Hauptclient - ein Schiff
    // soll in 2D und 3D nicht die Farbe wechseln.
    var t = Number(typ);
    if (t >= 80 && t <= 89) return "#ab2000";
    if (t >= 70 && t <= 79) return "#2a78d6";
    if (t >= 60 && t <= 69) return "#77a400";
    if (t === 30) return "#007a61";
    if (t === 36 || t === 37) return "#ca7197";
    if (t === 35 || t === 55 || t === 59) return "#460fdb";
    if ((t >= 31 && t <= 34) || (t >= 50 && t <= 58)) return "#8c2c95";
    return "#6b6b68";
  }

  function bauViewer() {
    // Kein Cesium ion: Das waere ein ZWEITER Schluessel neben dem von Google.
    // Ohne eigene baseLayer griffe der Viewer auf ion-Bilder zu und liefe in
    // eine Tokenwarnung.
    var osm = new Cesium.ImageryLayer(new Cesium.UrlTemplateImageryProvider({
      url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      maximumLevel: 19,
      credit: new Cesium.Credit('© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende', true)
    }));

    viewer = new Cesium.Viewer("cesium", {
      baseLayer: osm,
      baseLayerPicker: false,   // braucht ion
      geocoder: false,          // braucht ion
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      fullscreenButton: false,
      infoBox: false,
      selectionIndicator: false,
      // Zeitleiste und Abspielknoepfe bleiben: Sie SIND die Wiedergabe.
      // (Im Plan stand "abschalten" unter Speicher - das war falsch gezielt,
      // der Speicher geht in die Kacheln, nicht in zwei Bedienelemente.)
      timeline: true,
      animation: true,
      // Nur zeichnen, wenn sich etwas aendert: auf dem Telefon der groesste
      // Unterschied fuer Akku und Waerme.
      requestRenderMode: true,
      maximumRenderTimeChange: 0.5
    });
    // Griff fuer die Konsole und fuer die Probe: An einer 3D-Szene laesst
    // sich ueber das DOM nichts messen - eine Polylinie hat keinen Knoten.
    // Lesend, und es haengt nichts daran.
    window.__viewer = viewer;

    viewer.scene.globe.depthTestAgainstTerrain = true;
    // Dunst und Bodenatmosphaere AUS. Beide sind fuer den Blick auf einen
    // Globus gedacht; ueber einem Hafen waschen sie die Luftaufnahme zu einem
    // weissen Schleier aus - auf dem ersten Schirmfoto war vom Kai nichts
    // mehr zu erkennen, obwohl 44 Kacheln geladen waren.
    viewer.scene.fog.enabled = false;
    viewer.scene.globe.showGroundAtmosphere = false;
    viewer.scene.skyAtmosphere.show = false;
    viewer.scene.backgroundColor = Cesium.Color.fromCssColorString("#0f1720");
    return viewer;
  }

  function zeichneSpur() {
    var modus = el.hoehenModus.value;
    if (!spurPunkte.length) return;
    var t0 = spurPunkte[0].t, t1 = spurPunkte[spurPunkte.length - 1].t;
    var farbe = Cesium.Color.fromCssColorString(farbeFuerTyp(schiff && schiff.typ));

    var grade = [], wandMax = [], boden = [];
    for (var i = 0; i < spurPunkte.length; i++) {
      var p = spurPunkte[i];
      var h = hoeheFuer(p, modus, t0, t1);
      grade.push(p.lon, p.lat, h);
      wandMax.push(h);
      boden.push(p.lon, p.lat);
    }

    if (bandEntity) viewer.entities.remove(bandEntity);
    if (wandEntity) viewer.entities.remove(wandEntity);
    if (bodenEntity) viewer.entities.remove(bodenEntity);

    bandEntity = viewer.entities.add({
      polyline: {
        positions: Cesium.Cartesian3.fromDegreesArrayHeights(grade),
        width: 6,
        material: new Cesium.PolylineOutlineMaterialProperty({
          color: farbe, outlineColor: Cesium.Color.BLACK.withAlpha(0.65), outlineWidth: 2
        })
      }
    });

    // Die Wand macht die Hoehe ablesbar: Ohne sie schwebt ein Band im Raum,
    // und niemand sieht, wo ueber dem Wasser es steht.
    if (modus !== "flach") {
      wandEntity = viewer.entities.add({
        wall: {
          positions: Cesium.Cartesian3.fromDegreesArray(boden),
          maximumHeights: wandMax,
          minimumHeights: wandMax.map(function () { return 0; }),
          material: farbe.withAlpha(0.28),
          outline: false
        }
      });
    }

    // Und die echte Spur auf dem Wasser, damit der Weg selbst sichtbar bleibt.
    bodenEntity = viewer.entities.add({
      polyline: {
        positions: Cesium.Cartesian3.fromDegreesArray(boden),
        width: 3,
        clampToGround: true,
        material: farbe.withAlpha(0.75)
      }
    });
  }

  function bauSchiff() {
    if (!spurPunkte.length) return;
    var t0 = Cesium.JulianDate.fromDate(new Date(spurPunkte[0].t));
    var t1 = Cesium.JulianDate.fromDate(new Date(spurPunkte[spurPunkte.length - 1].t));

    // SampledPositionProperty + die Uhr des Viewers: Das Abspielen kostet
    // keinen eigenen Code, und die Zeitstempel sind die echten.
    var pos = new Cesium.SampledPositionProperty();
    for (var i = 0; i < spurPunkte.length; i++) {
      var p = spurPunkte[i];
      pos.addSample(Cesium.JulianDate.fromDate(new Date(p.t)),
        Cesium.Cartesian3.fromDegrees(p.lon, p.lat, 0));
    }
    pos.setInterpolationOptions({
      interpolationDegree: 1,
      interpolationAlgorithm: Cesium.LinearApproximation
    });

    var laenge = (schiff && schiff.laenge) || 60;
    var breite = (schiff && schiff.breite) || 12;
    var farbe = Cesium.Color.fromCssColorString(farbeFuerTyp(schiff && schiff.typ));

    schiffEntity = viewer.entities.add({
      availability: new Cesium.TimeIntervalCollection([
        new Cesium.TimeInterval({ start: t0, stop: t1 })
      ]),
      position: pos,
      orientation: new Cesium.VelocityOrientationProperty(pos),
      // Ein Kasten in den echten Massen des Schiffs - kein Modell, das eine
      // Bauform vortaeuscht, die AIS gar nicht hergibt.
      box: {
        dimensions: new Cesium.Cartesian3(laenge, breite, Math.max(6, breite * 0.6)),
        material: farbe,
        outline: true,
        outlineColor: Cesium.Color.BLACK.withAlpha(0.6)
      }
    });

    viewer.clock.startTime = t0.clone();
    viewer.clock.stopTime = t1.clone();
    viewer.clock.currentTime = t0.clone();
    viewer.clock.clockRange = Cesium.ClockRange.LOOP_STOP;
    viewer.clock.multiplier = 60;
    if (viewer.timeline) viewer.timeline.zoomTo(t0, t1);
  }

  function kameraAufSpur() {
    if (!spurPunkte.length) return;
    var kart = spurPunkte.map(function (p) {
      return Cesium.Cartesian3.fromDegrees(p.lon, p.lat, 0);
    });
    var kugel = Cesium.BoundingSphere.fromPoints(kart);
    viewer.camera.flyToBoundingSphere(kugel, {
      duration: 1.5,
      // Nicht genau von Norden: Von der Kante gesehen waere die Wand ein
      // Strich, und die dritte Dimension zeigte sich gar nicht.
      offset: new Cesium.HeadingPitchRange(
        Cesium.Math.toRadians(-35), Cesium.Math.toRadians(-28),
        Math.max(1500, kugel.radius * 4.5))
    });
  }

  // --- Photorealistische Kacheln ---------------------------------------
  function keyZustand(klasse, text) {
    el.keyZustand.className = "zustand " + klasse;
    el.keyZustand.textContent = text;
  }

  function googleAn(key) {
    if (!key) { keyZustand("warn", "kein Schlüssel"); return Promise.resolve(false); }
    keyZustand("warn", "wird geprüft…");
    Cesium.GoogleMaps.defaultApiKey = key;
    return Cesium.createGooglePhotorealistic3DTileset({
      // Gegen den Speicher auf dem iPad: groebere Kacheln, kleinerer Vorrat.
      maximumScreenSpaceError: 24,
      cacheBytes: 256 * 1024 * 1024,
      maximumCacheOverflowBytes: 128 * 1024 * 1024
    }).then(function (ts) {
      googleTileset = viewer.scene.primitives.add(ts);
      // Der Globus wuerde sonst durch die Gebaeude stechen.
      viewer.scene.globe.show = false;
      keyZustand("gut", "trägt");
      setze("aisstream_google_key", key);
      viewer.scene.requestRender();
      return true;
    }).catch(function (e) {
      keyZustand("schlecht", "abgelehnt");
      el.werte.insertAdjacentHTML("beforeend",
        '<div style="margin-top:.4rem;color:#ff9d9d">Google: ' +
        String(e && e.message || e).slice(0, 160) + "</div>");
      return false;
    });
  }

  // --- Anzeige: Bildrate, Kacheln, Speicher ----------------------------
  function werteTakt() {
    var rahmen = 0, letzte = performance.now(), fps = 0;
    viewer.scene.postRender.addEventListener(function () {
      rahmen++;
      var jetzt = performance.now();
      if (jetzt - letzte >= 1000) {
        fps = Math.round((rahmen * 1000) / (jetzt - letzte));
        rahmen = 0; letzte = jetzt;
      }
    });
    setInterval(function () {
      var zeilen = [];
      zeilen.push("<b>" + fps + "</b> Bilder/s");
      if (googleTileset && googleTileset.statistics) {
        var s = googleTileset.statistics;
        zeilen.push("<b>" + (s.numberOfTilesTotal || 0) + "</b> Kacheln, " +
          Math.round((s.geometryByteLength + s.texturesByteLength) / 1048576) + " MB");
      }
      // performance.memory gibt es nur in Chromium. Auf iOS steht dort nichts -
      // eine erfundene Zahl waere schlimmer als ein Strich.
      var m = performance.memory;
      zeilen.push("Heap: " + (m ? Math.round(m.usedJSHeapSize / 1048576) + " MB" : "—"));
      zeilen.push("<b>" + spurPunkte.length + "</b> Spurpunkte über " + STUNDEN + " h");
      el.werte.innerHTML = zeilen.join("<br>");
    }, 1000);
  }

  // --- Start ------------------------------------------------------------
  if (!MMSI) {
    meldung("Keine MMSI", "Diese Seite wird aus der Detailansicht heraus geöffnet: ?mmsi=…");
    return;
  }
  el.zurueck.href = "../?mmsi=" + encodeURIComponent(MMSI);
  el.titel.textContent = "MMSI " + MMSI;

  ladeCesium().then(function (C) {
    Cesium = C;
    meldung("Wird geladen…", "Spur wird geholt");
    bauViewer();
    werteTakt();
    return Promise.all([holeSpur(), holeSchiff()]);
  }).then(function (beides) {
    spurPunkte = punkteLesen(beides[0]);
    schiff = beides[1];
    if (schiff && schiff.name) el.titel.textContent = schiff.name;
    el.unter.textContent = "MMSI " + MMSI +
      (schiff && schiff.imo ? " · IMO " + schiff.imo : "") +
      " · " + spurPunkte.length + " Punkte / " + STUNDEN + " h";

    if (!spurPunkte.length) {
      meldung("Keine Spur", "Der Proxy hat für dieses Schiff in den letzten " +
        STUNDEN + " Stunden keine Positionen.");
      return;
    }
    hoeheEichen();
    zeichneSpur();
    bauSchiff();
    kameraAufSpur();
    meldungWeg();

    var key = hole("aisstream_google_key") || "";
    if (key) { el.googleKey.value = key; googleAn(key); }
    else keyZustand("warn", "kein Schlüssel");
  }).catch(function (e) {
    meldung("Das ging schief", String(e && e.message || e));
  });

  el.hoehenModus.addEventListener("change", function () {
    zeichneSpur();
    if (viewer) viewer.scene.requestRender();
  });
  el.keyUebernehmen.addEventListener("click", function () {
    var k = el.googleKey.value.trim();
    if (!k) {
      setze("aisstream_google_key", "");
      keyZustand("warn", "kein Schlüssel");
      return;
    }
    googleAn(k);
  });
})();
</script>
</body>
</html>
